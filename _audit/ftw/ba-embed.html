<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BA embed test</title>
<style>body{margin:0;font-family:system-ui,Arial,sans-serif;padding:24px;max-width:720px}h1{font-size:18px}</style>
</head><body>
<h1>Before/After embed (standalone, no backend)</h1>
<!-- BEGIN snippet (constructed exactly as buildSnippet emits, sample values; note the After label carries an injection probe: a"b<c> ) -->
<!-- WeFixTrades Before/After Slider -->
<div class="wft-ba" style="--ba-start:50%">
  <div class="wft-ba__frame" style="padding-bottom:75%">
    <img class="wft-ba__img wft-ba__before" src="https://images.unsplash.com/photo-1632759145351-1d592919f522?w=800&amp;q=70" alt="Old Roof" draggable="false" />
    <div class="wft-ba__after-wrap"><img class="wft-ba__img" src="https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=800&amp;q=70" alt="New &quot;Roof&quot; &lt;b&gt;" draggable="false" /></div>
    <span class="wft-ba__tag wft-ba__tag--l">Old Roof</span>
    <span class="wft-ba__tag wft-ba__tag--r">New &quot;Roof&quot; &lt;b&gt;</span>
    <div class="wft-ba__handle" role="slider" tabindex="0" aria-label="Drag to compare before and after" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
      <span class="wft-ba__grip"></span>
    </div>
  </div>
</div>
<style>
.wft-ba{position:relative;max-width:100%;margin:0 auto;font-family:inherit;-webkit-user-select:none;user-select:none}
.wft-ba__frame{position:relative;width:100%;height:0;overflow:hidden;border-radius:12px}
.wft-ba__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.wft-ba__after-wrap{position:absolute;inset:0;width:var(--ba-start);overflow:hidden}
.wft-ba__after-wrap .wft-ba__img{width:auto;min-width:100%;max-width:none}
.wft-ba__tag{position:absolute;bottom:10px;padding:3px 9px;font-size:12px;font-weight:600;line-height:1.4;color:rgba(255,255,255,0.96);background:rgba(17,24,39,0.7);border-radius:6px;pointer-events:none}
.wft-ba__tag--l{left:10px}
.wft-ba__tag--r{right:10px}
.wft-ba__handle{position:absolute;top:0;bottom:0;left:var(--ba-start);width:2px;background:rgba(255,255,255,0.9);transform:translateX(-1px);cursor:ew-resize;touch-action:none}
.wft-ba__grip{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(255,255,255,0.96);box-shadow:0 1px 4px rgba(17,24,39,0.35)}
.wft-ba__grip::before,.wft-ba__grip::after{content:"";position:absolute;top:50%;width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent}
.wft-ba__grip::before{left:8px;border-right:6px solid rgba(17,24,39,0.55)}
.wft-ba__grip::after{right:8px;border-left:6px solid rgba(17,24,39,0.55)}
.wft-ba__handle:focus{outline:none}
.wft-ba__handle:focus-visible .wft-ba__grip{box-shadow:0 0 0 3px rgba(37,99,235,0.5)}
</style>
<script>
(function(){
  var root=document.currentScript.previousElementSibling;
  while(root&&!(root.classList&&root.classList.contains("wft-ba"))){root=root.previousElementSibling;}
  if(!root)return;
  var frame=root.querySelector(".wft-ba__frame");
  var handle=root.querySelector(".wft-ba__handle");
  function set(p){p=Math.max(0,Math.min(100,p));root.style.setProperty("--ba-start",p+"%");handle.setAttribute("aria-valuenow",Math.round(p));}
  function fromX(clientX){var r=frame.getBoundingClientRect();return ((clientX-r.left)/r.width)*100;}
  var dragging=false;
  function down(e){dragging=true;handle.focus();move(e);e.preventDefault();}
  function move(e){if(!dragging)return;var x=e.touches?e.touches[0].clientX:e.clientX;set(fromX(x));}
  function up(){dragging=false;}
  handle.addEventListener("pointerdown",down);
  frame.addEventListener("pointerdown",down);
  window.addEventListener("pointermove",move);
  window.addEventListener("pointerup",up);
  handle.addEventListener("keydown",function(e){
    var cur=parseFloat(getComputedStyle(root).getPropertyValue("--ba-start"))||0;
    var step=(e.key==="ArrowLeft")?-4:(e.key==="ArrowRight")?4:(e.key==="Home")?-100:(e.key==="End")?100:0;
    if(step){e.preventDefault();set(cur+step);}
  });
})();
</script>
<!-- /WeFixTrades Before/After Slider -->
<!-- END snippet -->
</body></html>
