<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats embed test</title>
<style>body{margin:0;font-family:system-ui,Arial,sans-serif;padding:24px}h1{font-size:18px}.spacer{height:1200px}</style>
</head><body>
<h1>Stats counter embed (standalone, no backend) — scroll down to trigger count-up</h1>
<div class="spacer"></div>
<!-- WeFixTrades Stats Counter -->
<div class="wft-stats" style="--wft-accent:#2563EB">
    <div class="wft-stats__item">
      <div class="wft-stats__value" data-count="15" data-prefix="" data-suffix="">15</div>
      <div class="wft-stats__label">Years in business</div>
    </div>
    <div class="wft-stats__item">
      <div class="wft-stats__value" data-count="600" data-prefix="" data-suffix="+">600+</div>
      <div class="wft-stats__label">Jobs &lt;b&gt;&quot;done&quot; completed</div>
    </div>
    <div class="wft-stats__item">
      <div class="wft-stats__value" data-count="24" data-prefix="" data-suffix="/7">24/7</div>
      <div class="wft-stats__label">Emergency service</div>
    </div>
</div>
<style>
.wft-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 28px;padding:18px 14px;font-family:inherit;text-align:center}
.wft-stats__item{flex:1 1 120px;min-width:110px}
.wft-stats__value{font-size:30px;font-weight:800;line-height:1.1;color:var(--wft-accent)}
.wft-stats__label{margin-top:4px;font-size:13px;font-weight:500;color:rgba(75,85,99,0.95)}
@media (max-width:480px){.wft-stats__value{font-size:24px}.wft-stats{gap:8px 16px}}
</style>
<script>
(function(){
  var root=document.currentScript.previousElementSibling;
  while(root&&!(root.classList&&root.classList.contains("wft-stats"))){root=root.previousElementSibling;}
  if(!root)return;
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var vals=root.querySelectorAll(".wft-stats__value");
  function fmt(n){return n.toLocaleString();}
  function run(el){
    var target=parseInt(el.getAttribute("data-count"),10);
    if(isNaN(target))return;
    var pfx=el.getAttribute("data-prefix")||"";
    var sfx=el.getAttribute("data-suffix")||"";
    if(reduce){el.textContent=pfx+fmt(target)+sfx;return;}
    var dur=1200,t0=null;
    function tick(ts){
      if(!t0)t0=ts;
      var p=Math.min(1,(ts-t0)/dur);
      var eased=1-Math.pow(1-p,3);
      el.textContent=pfx+fmt(Math.round(target*eased))+sfx;
      if(p<1)requestAnimationFrame(tick);else el.textContent=pfx+fmt(target)+sfx;
    }
    requestAnimationFrame(tick);
  }
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){if(e.isIntersecting){run(e.target);io.unobserve(e.target);}});
    },{threshold:0.4});
    vals.forEach(function(el){if(el.hasAttribute("data-count"))io.observe(el);});
  }else{
    vals.forEach(run);
  }
})();
</script>
<!-- /WeFixTrades Stats Counter -->
</body></html>
