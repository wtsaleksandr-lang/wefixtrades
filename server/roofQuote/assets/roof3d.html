<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Roof &amp; Solar — true model</title>
<link rel="preconnect" href="https://api.fontshare.com"><link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#eef1f6; --panel:#ffffff; --line:#e1e7ef; --muted:#5b6573; --cyan:#0d3cfc; --blue:#0d3cfc; --ink:#0f172a; --faint:#94a3b8; --accent-tint:rgba(13,60,252,0.08); --accent-soft:rgba(13,60,252,0.14); --card-shadow:0 12px 40px rgba(15,23,42,0.08),0 2px 8px rgba(15,23,42,0.04); --btn-shadow:0 8px 20px rgba(13,60,252,0.28); }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Satoshi","Satoshi Variable",system-ui,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0}
  #scene{position:absolute;inset:0;touch-action:none;display:block}
  /* search bar */
  #bar{position:absolute;top:12px;left:12px;right:12px;z-index:20;display:flex;gap:8px;max-width:680px}
  #addr{flex:1;background:#ffffff;border:1px solid #e1e7ef;border-radius:10px;padding:13px 15px;height:48px;color:#0f172a;font-size:15px;outline:none}
  #addr::placeholder{color:#94a3b8}
  #addr:focus{border-color:#0d3cfc;box-shadow:0 0 0 3px rgba(13,60,252,0.12)}
  #go{background:#0d3cfc;border:0;border-radius:10px;padding:0 18px;font-weight:700;color:#ffffff;font-size:15px;cursor:pointer;box-shadow:var(--btn-shadow)}
  /* status chip */
  #status{position:absolute;top:62px;left:12px;z-index:20;background:#ffffff;border:1px solid #e1e7ef;border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted);max-width:80vw;display:none;box-shadow:var(--card-shadow)}
  #status.err{color:#dc2626;border-color:#fecaca}
  /* report card */
  #card{position:absolute;left:12px;bottom:12px;z-index:20;width:264px;background:#ffffff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid #e1e7ef;border-radius:18px;padding:12px 14px;display:none;box-shadow:var(--card-shadow)}
  #card .qtabs{display:flex;gap:6px;margin-bottom:10px}
  #card .qtab{flex:1;background:#f7f9fc;border:1px solid #e1e7ef;border-radius:10px;padding:8px 0;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
  #card .qtab.on{background:var(--accent-soft);border-color:#0d3cfc;color:#0f172a}
  #card .qprice{font-size:26px;font-weight:800;line-height:1.05;color:#0f172a}
  #card .qprice .qunit{font-size:13px;font-weight:600;color:var(--muted)}
  #card .qband{font-size:11px;font-weight:700;color:#5b6573;background:#eef1f6;border:1px solid var(--line);border-radius:6px;padding:1px 6px;vertical-align:middle;margin-left:3px}
  #card .tk-note{font-size:10px;color:var(--faint);margin-top:7px;line-height:1.35}
  #card .tk-detect{display:flex;align-items:center;gap:5px;font-size:11px;color:#0d3cfc;font-weight:600;margin-top:8px;line-height:1.3}
  #card .tk-detect svg{flex:0 0 auto}
  #card .mrows{margin-top:10px;display:flex;flex-direction:column;gap:4px}
  #card .mrow{display:flex;justify-content:space-between;align-items:center;font-size:12px}
  #card .mrow span{color:var(--muted);display:flex;align-items:center}
  #card .mrow i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
  #card .mrow b{color:#0f172a;font-weight:700}
  #card .waste-row{display:flex;align-items:center;gap:4px;margin:11px 0 2px;font-size:11px;color:var(--muted);flex-wrap:wrap}
  #card .waste-row>span{margin-right:2px}
  #card .wb,#card .bb,#card .pb,#card .btm,#card .ld,#card .bd,#card .evt,#card .evm,#card .pm{flex:0 0 auto;background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
  #card .wb.on,#card .bb.on,#card .pb.on,#card .btm.on,#card .ld.on,#card .bd.on,#card .evt.on,#card .evm.on,#card .pm.on{border-color:#0d3cfc;background:rgba(13,60,252,0.06);color:#0d3cfc}
  #card .szrange{flex:1;min-width:80px;accent-color:#0d3cfc;height:4px}
  #card .szval{flex:0 0 auto;font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap}
  #card .opt-l.ico{display:inline-flex;align-items:center;gap:3px}

  /* premium KPI strip — shown once the homeowner enters their bill */
  #card .kpis{display:flex;gap:6px;margin:9px 0 2px}
  #card .kpi{flex:1;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;min-width:0}
  #card .kpi .kv{font-size:16px;font-weight:800;color:#0b1424;line-height:1.1}
  #card .kpi .kl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
  #card .kpi .kpre{font-size:9px;color:var(--muted);margin-top:1px}
  #card .kpi.gauge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  #card .gauge-ring{width:40px;height:40px;border-radius:50%;background:conic-gradient(#0d3cfc calc(var(--p)*1%),#e6ebf3 0);display:flex;align-items:center;justify-content:center;position:relative}

  #card .gauge-ring span{position:relative;font-size:10px;font-weight:800;color:#0d3cfc}
  #card .co2line{margin-top:8px;font-size:11px;color:#1a7a4a;background:#f0faf4;border:1px solid #d6efe0;border-radius:8px;padding:6px 9px;line-height:1.4}
  #card .sunline{margin-top:8px;font-size:11px;color:#9a6a00;background:#fff8e8;border:1px solid #f0e2bf;border-radius:8px;padding:6px 9px;line-height:1.4}
  #card .opt-row{display:flex;align-items:center;gap:4px;margin:5px 0 2px;flex-wrap:wrap}
  #card .opt-l{font-size:11px;color:var(--muted);margin-right:2px}
  #card .ob{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
  #card .ob svg{flex:0 0 auto;opacity:.85}
  #card .ob.on{border-color:#0d3cfc;background:rgba(13,60,252,0.06);color:#0d3cfc}
  #card .cust-toggle{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);margin-top:11px;padding:9px 0 0;color:#0d3cfc;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  #card .cust{margin-top:2px}
  #card .cust-sec{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#9aa7b8;margin:12px 0 2px}
  #card .cust-sec:first-child{margin-top:4px}
  #card .addon-card{background:#fbfcfe;border:1px solid var(--line);border-radius:11px;padding:7px 10px;margin-top:7px}
  #card .addon-card .opt-row:first-child{margin-top:0}
  #card .ao-sum{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;border-top:1px dashed var(--line);margin-top:6px;padding:7px 0 1px;color:#475569;font-size:11.5px;font-family:inherit;cursor:pointer;text-align:left}
  #card .ao-sum b{color:#0f172a}
  #card .ao-chev{flex:0 0 auto;color:#0d3cfc;font-weight:700;font-size:11px}
  #card .tk-h{font-size:11px;font-weight:700;color:#0f172a;margin:11px 0 5px}
  #card .takeoff{display:flex;flex-direction:column;gap:3px}
  #card .tk-row{display:flex;justify-content:space-between;font-size:12px}
  #card .tk-row span{color:var(--muted)}
  #card .tk-row b{color:#0f172a;font-weight:600}
  #card .qfin{font-size:11.5px;color:var(--muted);margin:7px 0 0;line-height:1.35}
  #card .qfin b{color:#0f172a;font-weight:800}
  #baHandle{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.35);z-index:18;cursor:ew-resize;touch-action:none}
  #baHandle .ba-knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#0d3cfc}
  .ba-tag{position:absolute;top:12px;z-index:18;background:rgba(16,22,33,.72);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:none}
  #baTagA{left:12px} #baTagB{right:12px}
  .pac-container{font-family:"Satoshi","Satoshi Variable",system-ui,sans-serif;border-radius:12px;border:1px solid #e1e7ef;box-shadow:0 12px 40px rgba(15,23,42,.14);margin-top:5px;z-index:9999;overflow:hidden}
  .pac-item{padding:8px 12px;font-size:13px;color:#0f172a;cursor:pointer;border-top:1px solid #f1f4f8}
  .pac-item:hover,.pac-item-selected{background:rgba(13,60,252,0.06)}
  .pac-icon{display:none} .pac-item-query{font-size:13px;color:#0f172a}
  #card .qsub{font-size:11px;color:var(--muted);margin:2px 0 10px}
  #card .qaddr{display:flex;align-items:center;gap:4px;font-size:11px;color:#94a3b8;margin:0 0 9px;line-height:1.2}
  #card .qaddr svg{flex:0 0 auto;opacity:.8}
  #card .qpick{font-size:12px;font-weight:700;color:#0d3cfc;margin:0 0 2px}
  #card .qspec{font-size:11px;font-weight:600;color:var(--muted);margin:1px 0 6px}
  #card .qprompt{font-size:14px;color:#0f172a;font-weight:600;margin:2px 0 11px;line-height:1.3}
  #card .cmp{display:flex;flex-direction:column;gap:2px;margin:8px 0 2px}
  #card .cmp-row{display:flex;align-items:center;gap:8px;background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;font-family:inherit;text-align:left;width:100%}
  #card .cmp-row:hover{border-color:#0d3cfc;background:rgba(13,60,252,0.05)}
  #card .cmp-n{flex:1;font-size:12px;font-weight:700;color:#0f172a}
  #card .cmp-p{font-size:12px;font-weight:700;color:#0d3cfc;white-space:nowrap}
  #card .cmp-l{font-size:10px;color:var(--muted);min-width:52px;text-align:right;white-space:nowrap}
  #card .qchips{display:flex;gap:6px;margin-bottom:11px}
  #card .qchip{flex:1;background:#f7f9fc;border:1px solid #e1e7ef;border-radius:10px;padding:6px 0;color:#0f172a;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
  #card .qchip span{font-size:10px;font-weight:500;color:var(--muted)}
  #card .qchip.on{background:rgba(13,60,252,0.06);border-color:#0d3cfc;color:#0f172a}
  #card .qchip.on span{color:var(--muted)}
  #card .qnote{font-size:9.5px;color:#94a3b8;margin-top:9px;line-height:1.3}
  #card .qcta{width:100%;margin-top:11px;background:#0d3cfc;border:0;border-radius:10px;padding:11px 0;font-size:14px;font-weight:800;color:#ffffff;cursor:pointer;box-shadow:var(--btn-shadow)}
  /* ===== quote report (PDF / web) ===== */
  #report{position:fixed;inset:0;z-index:50;background:#fff;color:#0f172a;overflow:auto;display:none;font:14px/1.55 "Satoshi","Satoshi Variable",system-ui,sans-serif}
  #report .rbar{position:sticky;top:0;background:#ffffff;border-bottom:1px solid #e1e7ef;display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;z-index:2}
  #report .rbar button{background:#0d3cfc;border:0;border-radius:8px;padding:8px 15px;font-weight:700;color:#ffffff;cursor:pointer;font-size:13px;box-shadow:var(--btn-shadow)}
  #report .rbar button.ghost{background:#f7f9fc;border:1px solid #e1e7ef;color:#0f172a;box-shadow:none}
  #report .rwrap{max-width:740px;margin:0 auto;padding-bottom:50px}
  #report .hero{position:relative;height:230px;background:#0b1017}
  #report .hero img{width:100%;height:100%;object-fit:cover;opacity:.9}
  #report .hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,18,.05),rgba(7,11,18,.82));display:flex;flex-direction:column;justify-content:flex-end;padding:22px 30px;color:#fff}
  #report .brand{font-weight:800;letter-spacing:.14em;font-size:13px;color:#a9c0ff}
  #report .hero h1{font-size:25px;margin:6px 0 4px;font-weight:800}
  #report .hero .addr{opacity:.9;font-size:13px}
  #report .sec{padding:22px 30px;border-bottom:1px solid #e1e7ef}
  #report .sec h2{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#94a3b8;margin:0 0 12px}
  #report .bul{display:flex;gap:10px;margin:7px 0;align-items:flex-start}
  #report .bul b{color:#0d3cfc}
  #report .bm{width:7px;height:7px;border-radius:2px;background:#0d3cfc;margin-top:7px;flex:0 0 auto}
  #report .bc{width:16px;height:16px;flex:0 0 auto;margin-top:1px;fill:none;stroke:#0d3cfc;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #report .tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  #report .tier{border:1px solid #e1e7ef;border-radius:12px;padding:14px 10px;text-align:center}
  #report .tier.pop{border-color:#0d3cfc;box-shadow:0 0 0 2px rgba(13,60,252,.18)}
  #report .tier .tn{font-weight:700;font-size:13px}.tier .pop-tag{font-size:9px;color:#0d3cfc;font-weight:700}
  #report .tier .mo{font-size:21px;font-weight:800;margin:6px 0 1px}
  #report .tier .ca{font-size:11px;color:var(--muted)}
  #report .pricebig{font-size:30px;font-weight:800}
  #report .muted{color:var(--muted);font-size:12px}
  #report .signbox{text-align:center;color:#94a3b8;margin-top:10px;font-size:12px}
  #report .rcta{width:100%;background:#0d3cfc;border:0;border-radius:12px;padding:15px 0;font-size:16px;font-weight:800;color:#ffffff;cursor:pointer;box-shadow:var(--btn-shadow)}
  #report .rcta.done{background:#16a34a;color:#fff;cursor:default;box-shadow:none}
  #report .rbadge{text-align:center;padding:8px 14px 22px;font-size:11px;color:#94a3b8}
  #report .rbadge b{color:#0d3cfc;font-weight:800}
  #report .foot{padding:18px 30px;color:#94a3b8;font-size:10.5px;line-height:1.5}
  @media print{ #report .rbar{display:none!important} #report{position:static;display:block!important} #app>*:not(#report){display:none!important} }
  #matHint{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:16;background:#ffffff;border:1px solid #e1e7ef;border-radius:9px;padding:6px 12px;font-size:11px;color:var(--muted);display:none;box-shadow:var(--card-shadow)}
  /* lead capture */
  #lead{position:fixed;inset:0;z-index:55;background:rgba(15,23,42,.4);display:none;align-items:center;justify-content:center;padding:20px}
  #lead .lead-card{background:#ffffff;border:1px solid #e1e7ef;border-radius:18px;padding:24px;width:100%;max-width:360px;box-shadow:var(--card-shadow)}
  #lead .lead-h{font-size:19px;font-weight:800;color:#0f172a}
  #lead .lead-s{font-size:13px;color:var(--muted);margin:4px 0 16px}
  #lead input{width:100%;background:#ffffff;border:1px solid #e1e7ef;border-radius:10px;padding:12px 14px;height:48px;color:#0f172a;font-size:15px;margin-bottom:10px;outline:none}
  #lead input::placeholder{color:#94a3b8}
  #lead input:focus{border-color:#0d3cfc;box-shadow:0 0 0 3px rgba(13,60,252,0.12)}
  #lead #ltime{width:100%;background:#fff;border:1px solid #e1e7ef;border-radius:10px;padding:0 14px;height:46px;color:#0f172a;font-size:14px;margin-bottom:10px;outline:none}
  #lead .lq-l{display:block;font-size:11px;color:#94a3b8;margin-bottom:6px}
  #lead .lq-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  #lead .lqp{flex:0 0 auto;background:#f7f9fc;border:1px solid #e1e7ef;border-radius:8px;padding:6px 10px;color:#64748b;font-size:12px;font-weight:700;cursor:pointer}
  #lead .lqp.on{border-color:#0d3cfc;background:rgba(13,60,252,0.06);color:#0d3cfc}
  #lead #lgo{width:100%;background:#0d3cfc;border:0;border-radius:10px;padding:13px 0;font-size:15px;font-weight:800;color:#ffffff;cursor:pointer;margin-top:4px;box-shadow:var(--btn-shadow)}
  #lead .lead-x{text-align:center;color:var(--muted);font-size:12px;margin-top:12px;cursor:pointer}
  /* reusable info modal (material + data help cues) */
  #infoModal{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:20px}
  #infoModal .im-card{position:relative;background:#fff;border:1px solid #e1e7ef;border-radius:18px;padding:22px;width:100%;max-width:380px;max-height:86vh;overflow-y:auto;box-shadow:var(--card-shadow)}
  #infoModal .im-x{position:absolute;top:12px;right:12px;width:30px;height:30px;border:0;border-radius:8px;background:#f7f9fc;color:#5b6573;font-size:20px;line-height:1;cursor:pointer}

  #infoModal .im-note{font-size:11.5px;color:#5b6573;line-height:1.45;background:#f7f9fc;border:1px solid #e1e7ef;border-radius:10px;padding:10px 12px;margin-top:12px}

  .helpcue:hover{border-color:#0d3cfc;background:rgba(13,60,252,.06)}
  #card .big{font-size:30px;font-weight:800;line-height:1} #card .unit{font-size:12px;color:var(--muted)}
  #card .sq{font-size:12px;color:#0d3cfc;margin-top:2px}

  #card .stat .v{font-size:18px;font-weight:700;color:#0f172a} #card .stat .l{font-size:11px;color:var(--muted)}

  #ctrls{position:absolute;right:12px;bottom:12px;z-index:20;display:flex;flex-direction:column;gap:7px}
  #ctrls button{width:56px;height:56px;border-radius:16px;background:#ffffff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid #e1e7ef;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;box-shadow:var(--card-shadow)}

/* ---------- WGS84 -> UTM (forward, for a given zone) ---------- */

function updateSun(){
  const std=Math.round(SITE.lng/15), dst=(sunMonth>=3&&sunMonth<=10)?1:0; tzOffset=std+dst;
  const d=new Date(Date.UTC(2026, sunMonth-1, 21, sunHourLocal-tzOffset, 0));
  const sp=sunPosition(d, SITE.lat, SITE.lng);
  const lbl=$("sTimeV"); if(lbl){ const h=Math.floor(sunHourLocal), m=Math.round((sunHourLocal-h)*60);
    const ap=h>=12?"PM":"AM", h12=((h+11)%12)+1; lbl.textContent=h12+":"+String(m).padStart(2,"0")+" "+ap; }
  const mv=$("sMonthV"); if(mv) mv.textContent=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][sunMonth-1];
  if(sp.altitude<=1){ sun.intensity=0.15; ambient.intensity=0.55; scene.background.setHex(0x0a0e16); return; }
  sun.intensity=Math.min(2.8, 1.1+sp.altitude/22); ambient.intensity=0.42;
  // dusk tint when low
  scene.background.setHex(sp.altitude<8?0x10131c:0x0b1017);
  const a=sp.azimuth*Math.PI/180, e=sp.altitude*Math.PI/180;
  const dir=new THREE.Vector3(Math.sin(a)*Math.cos(e), Math.sin(e), -Math.cos(a)*Math.cos(e));
  sun.position.copy(controls.target).addScaledVector(dir, SCENE_R*2.2);
  sun.target.position.copy(controls.target); sun.target.updateMatrixWorld();
  window.__sun={az:+sp.azimuth.toFixed(1),alt:+sp.altitude.toFixed(1)};
}

async function buildPhotoLabels(){

    if(PinElement){ try{ m.append(new PinElement({ background:"#0b1220", borderColor:"#22d3ee", glyph:"", scale:big?0.5:0.38 })); }catch(_){} }
    gmap.append(m); photoLabels.push(m); return m; };

  window.__facetGoogle=(LASTB.solarPotential.roofSegmentStats||[]).map(s=>Math.round(((s.stats&&s.stats.areaMeters2)||0)*M2_SQFT));
  const placedMids=[];   // dedupe shared ridge/valley lines so they aren't labelled twice
  for(const f of facets){

    const ga=(f.seg.stats&&f.seg.stats.areaMeters2)||f.slopeArea;
    const sqft=Math.round(ga*M2_SQFT), x12=Math.round(Math.abs(Math.tan((f.seg.pitchDegrees||0)*Math.PI/180))*12);
    try{
      const poly=new Polygon3DElement({ altitudeMode:AltitudeMode.RELATIVE_TO_MESH, fillColor:"rgba(34,211,238,0.15)", strokeColor:"rgba(34,211,238,0.95)", strokeWidth:2, extruded:false, drawsOccludedSegments:false });
      poly.outerCoordinates=f.hull.map(([lng,lat])=>({lat,lng,altitude:0.6})); gmap.append(poly); photoLabels.push(poly);
      const c=f.seg.center;

      const H=f.hull, mLatE=111320, mLngE=111320*Math.cos((H[0][1])*Math.PI/180);

      }

let heatCells=[];

async function buildPhotoHeatmap(){
  if(!gmap||!LASTFLUX||!LASTB){ window.__heatCells=0; return; }
  clearHeat();
  const { Polygon3DElement, AltitudeMode }=await google.maps.importLibrary("maps3d");
  const fx=LASTFLUX, zone=fx.zone;
  const fg={vals:fx.rasters[0],w:fx.width,h:fx.height,bbox:fx.bbox};
  const mg=LASTMASK?{vals:LASTMASK.rasters[0],w:LASTMASK.width,h:LASTMASK.height,bbox:LASTMASK.bbox}:null;
  const segs=LASTB.solarPotential.roofSegmentStats||[];
  let s=90,w=180,nn=-90,e=-180;
  for(const g of segs){ const b=g.boundingBox; if(!b)continue; s=Math.min(s,b.sw.latitude); nn=Math.max(nn,b.ne.latitude); w=Math.min(w,b.sw.longitude); e=Math.max(e,b.ne.longitude); }
  if(s>nn) return;
  // step 0.55 + half-size 0.38 (cells overlap → smooths the grid look); erode only 0.5m so coverage reaches the roofline
  const mLat=111320, mLng=111320*Math.cos(((s+nn)/2)*Math.PI/180), step=0.55, dLat=step/mLat, dLng=step/mLng, hLat=0.38/mLat, hLng=0.38/mLng;
  let fmin=Infinity,fmax=-Infinity; const pts=[];
  for(let lat=s; lat<=nn; lat+=dLat) for(let lng=w; lng<=e; lng+=dLng){
    const [E,N]=wgs84ToUTM(lat,lng,zone);
    if(mg && !roofInterior(mg,E,N,0.5)) continue;   // small erode: keep cells off the wall but still reach the roofline
    const v=sampleGrid(fg,E,N); if(!(v>0)||!isFinite(v)) continue;
    if(v<fmin)fmin=v; if(v>fmax)fmax=v; pts.push([lat,lng,v]);
  }
  if(!pts.length) return; const range=(fmax-fmin)||1;
  for(let i=0;i<Math.min(pts.length,1100);i++){ const [lat,lng,v]=pts[i];
    const poly=new Polygon3DElement({ altitudeMode:AltitudeMode.RELATIVE_TO_MESH, fillColor:energyColor((v-fmin)/range), strokeWidth:0, extruded:false, drawsOccludedSegments:false });
    poly.outerCoordinates=[ {lat:lat-hLat,lng:lng-hLng,altitude:0.12},{lat:lat-hLat,lng:lng+hLng,altitude:0.12},{lat:lat+hLat,lng:lng+hLng,altitude:0.12},{lat:lat+hLat,lng:lng-hLng,altitude:0.12} ];
    gmap.append(poly); heatCells.push(poly);
  }
  window.__heatCells=heatCells.length;
}

/* 4 lat/lng/alt corners of a panel, sitting on its facet plane */
function panelCornersLL(pn,seg,pw,ph){
  const lat=pn.center.latitude, lng=pn.center.longitude;
  const Az=(seg.azimuthDegrees||0)*Math.PI/180, tanP=Math.tan((seg.pitchDegrees||0)*Math.PI/180);
  const land=pn.orientation==="LANDSCAPE", w=land?ph:pw, h=land?pw:ph;     // across=w, along-slope=h
  const mLat=111320, mLng=111320*Math.cos(lat*Math.PI/180);
  const ax=Math.cos(Az), an=-Math.sin(Az), fx=Math.sin(Az), fn=Math.cos(Az); // across / facing in (E,N)
  // altitude is RELATIVE_TO_MESH → small constant lift drapes the panel onto Google's actual roof surface
  return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([i,j])=>{
    const dE=i*(w/2)*ax + j*(h/2)*fx, dN=i*(w/2)*an + j*(h/2)*fn;
    return { lat:lat+dN/mLat, lng:lng+dE/mLng, altitude: 0.5 };
  });
}

    b.onclick=()=>{ selMat=i; selCol=0; [...cats.children].forEach((x,j)=>x.classList.toggle("on",j===i)); renderCols(); if(matMode) renderColor(true); };
    cats.appendChild(b); });
  const cols=document.createElement("div"); cols.id="matCols";
  mb.appendChild(cats); mb.appendChild(cols); renderCols();
}
function renderCols(){
  const m=ROOF_CATALOG[selMat]||ROOF_CATALOG[0], wrap=$("matCols"); if(!wrap) return; wrap.innerHTML="";
  m.colors.forEach((c,i)=>{ const d=document.createElement("div"); d.className="sw"+(i===selCol?" on":"")+(window.__matRenders[colorKey(m,c)]?" ready":"");
    let bg=c.base; try{ bg="center/cover url("+makeShingleCanvas(c.base,m.type).toDataURL()+")"; }catch(_){}
    d.innerHTML='<div class="chip" style="background:'+bg+'"></div><div class="nm">'+c.n+'</div>';
    d.onclick=()=>{ if(matMode){ selCol=i; renderColor(true); } };
    wrap.appendChild(d); });
}
// live price for the current material selection — surfaced in the render bar so mobile sees the price while browsing (the quote card is hidden behind the catalogue on mobile)
function matPriceStr(){
  if(!window.__roofSel||!QUOTE) return "";
  const sel=window.__roofSel, sqs=QUOTE.roofSqft/100, psq=ROOF_PSQ[sel.matId]||[450,700], wf=1+WASTE_OPTS[selWaste]/100;
  let [lo,hi]=applyRoofOpts(sqs*wf*psq[0], sqs*wf*psq[1], sqs, getRoofTotals());
  return fmtMoney(Math.round(lo/50)*50)+"–"+fmtMoney(Math.round(hi/50)*50);
}
function showMatImg(key,label){ const img=$("aiPhoto"); img.src=window.__matRenders[key]; img.style.display="block"; matLoading(false);
  const pr=matPriceStr(); $("aiMat").innerHTML=(label||"")+(pr?' <b class="ai-price">'+pr+'</b>':''); $("aiBar").style.display="flex"; activateBA(); }
function markColReady(key){ const m=ROOF_CATALOG[selMat]; if(!m) return; const idx=m.colors.findIndex(c=>colorKey(m,c)===key); const wrap=$("matCols"); if(idx>=0&&wrap&&wrap.children[idx]) wrap.children[idx].classList.add("ready"); }
async function renderOne(m,c,show){
  const key=colorKey(m,c), addr=$("addr").value.trim(), label=m.label+" · "+c.n;
  if(show){ window.__roofSel={matId:m.id,matLabel:m.label,colorName:c.n}; if(typeof renderQuoteCard==="function") renderQuoteCard();
    const wrap=$("matCols"); if(wrap)[...wrap.children].forEach((x,j)=>x.classList.toggle("on",j===m.colors.indexOf(c)));
    scheduleFinal(m,c,key,label); }   // upgrade to crisp gpt-image-1 only if they settle on this colour
  if(window.__matRenders[key]){ if(show) showMatImg(key,label); return window.__matRenders[key]; }
  if(window.__matInflight[key]){ const u=await window.__matInflight[key]; if(show&&u) showMatImg(key,label); return u; }
  if(show){ $("aiPhoto").style.display="block"; matLoading(true,c.n); }
  const pr=(async()=>{ try{ const r=await fetch(RQ_BASE+"/airender?tier=browse&address="+encodeURIComponent(addr)+"&material="+encodeURIComponent(c.p)); const j=await r.json();
    if(j&&j.url){ if(!window.__matFinal[key]) window.__matRenders[key]=j.url; markColReady(key); return j.url; } }catch(_){} return null; })();   // don't let a late browse render clobber a settled gpt-image-1 (final) one
  window.__matInflight[key]=pr; const url=await pr; delete window.__matInflight[key];
  if(url){ if(show&&!window.__matFinal[key]) showMatImg(key,label); }   // final (gpt) already on screen → don't redisplay the cheaper browse image
  else if(show){ matLoading(false); setStatus("Couldn't render "+c.n+" — try again",true); setTimeout(()=>setStatus(""),3000); }
  return url;
}
function renderColor(show){ const m=ROOF_CATALOG[selMat]||ROOF_CATALOG[0]; return renderOne(m, m.colors[selCol]||m.colors[0], show); }
// cost routing: catalogue clicks render cheap (browse). The colour they SETTLE on (no new click for ~1.8s) upgrades to crisp gpt-image-1.
window.__matFinal={}; let finalTimer=null;
function scheduleFinal(m,c,key,label){
  clearTimeout(finalTimer);
  if(window.__matFinal[key]) return;   // already upgraded to gpt
  finalTimer=setTimeout(async()=>{
    const cur=ROOF_CATALOG[selMat]&&ROOF_CATALOG[selMat].colors[selCol];
    if(!cur || colorKey(ROOF_CATALOG[selMat],cur)!==key) return;   // they moved on → don't pay for gpt
    try{ const r=await fetch(RQ_BASE+"/airender?tier=final&address="+encodeURIComponent($("addr").value.trim())+"&material="+encodeURIComponent(c.p)); const j=await r.json();
      if(j&&j.url){ window.__matFinal[key]=true; window.__matRenders[key]=j.url;
        const now=ROOF_CATALOG[selMat]&&ROOF_CATALOG[selMat].colors[selCol];
        if(now && colorKey(ROOF_CATALOG[selMat],now)===key){ const img=$("aiPhoto"); if(img) img.src=j.url; } } }catch(_){}
  }, 1800);
}
async function warmMats(){ if(window.__matWarming||!window.__roofReady) return; window.__matWarming=true;
  // cost control: pre-warm only the top 3 colours of the selected material; the rest render on click + cache
  const m=ROOF_CATALOG[selMat]||ROOF_CATALOG[0];
  for(let i=0;i<Math.min(3,m.colors.length);i++){ if(!window.__roofReady||!matMode) break; await renderOne(m,m.colors[i],false); }
  window.__matWarming=false; }
async function enterMatCatalogue(){
  $("matbar").style.display="flex"; $("matHint").style.display="none"; $("aiBtn").style.display="none";
  if(!$("matCats")) buildMatbar(); else renderCols();
  await renderColor(true); warmMats(); }
function exitMatCatalogue(){ if(typeof hideAI==="function") hideAI(); $("matbar").style.display="none"; $("aiBar").style.display="none"; }
$("bRoof").onclick=async()=>{
  matMode=!matMode; $("bRoof").classList.toggle("on",matMode);
  if(matMode){ sunMode=false; labelsVisible=false; panelsVisible=false;
    $("bSun").classList.remove("on"); $("bLabels").classList.remove("on"); $("bPanels").classList.remove("on");
    clearPanels(); clearHeat(); clearLabels(); clearMat(); clearRoofMeas();
    showAnalysis(null); document.body.classList.add("analyzing"); enterMatCatalogue(); }
  else { document.body.classList.remove("analyzing"); exitMatCatalogue(); if(typeof renderQuoteCard==="function") renderQuoteCard(); }   // back to the clean 3D house + updated quote
};
// from the card's "Choose materials →" CTA: jump straight into the Roofing material catalogue
window.__openMaterials=()=>{ if(tradeMode!=="roof"){ tradeMode="roof"; renderQuoteCard(); applyTradeMode(); } if(!matMode) $("bRoof").click(); };
// ---- AI "See it on my house" photoreal roof render (Street View → Flux Kontext) ----
// ── Before/After slider: drag the divider to wipe between the new material (left) and the original roof (right) ──
function setBAPos(pos){ pos=Math.max(3,Math.min(97,pos)); window.__baPos=pos; const b=$("baBefore"); if(b) b.style.clipPath="inset(0 0 0 "+pos+"%)"; const h=$("baHandle"); if(h) h.style.left="calc("+pos+"% - 1px)"; }
function activateBA(){ const addr=$("addr").value.trim(); if(!addr) return; $("baBefore").src="/api/roofquote/capture?address="+encodeURIComponent(addr); ["baBefore","baHandle","baTagA","baTagB"].forEach(id=>{ const e=$(id); if(e) e.style.display="block"; }); setBAPos(window.__baPos||55); }
function deactivateBA(){ ["baBefore","baHandle","baTagA","baTagB"].forEach(id=>{ const e=$(id); if(e) e.style.display="none"; }); }
(function(){ let drag=false; const rect=()=>$("aiPhoto").getBoundingClientRect();
  const upd=cx=>{ const r=rect(); if(r.width) setBAPos((cx-r.left)/r.width*100); };
  const h=$("baHandle"); if(h){ h.addEventListener("pointerdown",e=>{ drag=true; e.preventDefault(); try{h.setPointerCapture(e.pointerId);}catch(_){} });
    window.addEventListener("pointermove",e=>{ if(drag) upd(e.clientX); }); window.addEventListener("pointerup",()=>{ drag=false; }); }
})();
function hideAI(){ $("aiPhoto").style.display="none"; $("aiBar").style.display="none"; $("aiPhoto").src=""; deactivateBA(); }
$("aiBtn").onclick=async()=>{
  const addr=$("addr").value.trim(); const mt=ROOF_MATS[matIdx]||ROOF_MATS[0]; const btn=$("aiBtn");
  btn.disabled=true; btn.textContent="Modeling your home…";
  setStatus("Building a photoreal view of your home & applying "+mt.n+" — about 30 seconds…");
  try{
    const r=await fetch(RQ_BASE+"/airender?address="+encodeURIComponent(addr)+"&material="+encodeURIComponent(mt.p));
    const j=await r.json();
    setStatus("");
    if(j.url){
      const img=$("aiPhoto"); img.src=j.url; img.style.display="block";
      $("aiMat").textContent=mt.n+" — your home";
      activateBA();   // before/after slider supersedes the old toggle
      $("aiBar").style.display="flex"; btn.style.display="none";
    } else { setStatus(j.error==="no_streetview"?"No street photo for this address yet":"Couldn't render — try again",true); setTimeout(()=>setStatus(""),3500); }
  }catch(e){ setStatus("Render failed — try again",true); setTimeout(()=>setStatus(""),3500); }
  btn.disabled=false; btn.textContent="See it on my house";
};
$("aiBack").onclick=()=>{ hideAI(); $("aiBtn").style.display="block"; };
$("bReset").onclick=()=>{ if(mode==="photoreal"&&gmap){ gmap.flyCameraTo&&gmap.flyCameraTo({endCamera:{center:{lat:SITE.lat,lng:SITE.lng,altitude:siteAlt},range:78,tilt:58,heading:15},durationMillis:900}); return;} if(window.__roofReady){ const d=window.__roofDebug||{}; const span=(d.crop||30)*2; camera.position.set(span*0.48,span*0.62,span*0.72); controls.target.set(0,5,0); controls.update(); } };
$("sTime").addEventListener("input",e=>{ sunHourLocal=+e.target.value; if(window.__roofReady) updateSun(); });
$("sMonth").addEventListener("input",e=>{ sunMonth=+e.target.value; if(window.__roofReady) updateSun(); });
// auto-run on load for fast iteration — skipped with ?noauto=1 (used by the headless /capture so it controls the single search)
{ const _qp=new URLSearchParams(location.search);
  const _a=_qp.get("a"); if(_a) $("addr").value=_a;                 // restore a shared quote's address
  window.__restoreMat=_qp.get("m")||null; window.__restoreCol=_qp.get("c")||null;   // optional shared material/colour
  if(!_qp.get("noauto")) run($("addr").value.trim()); }
</script>
