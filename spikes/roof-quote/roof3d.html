<title>3D Roof &amp; Solar — true model</title>
<style>
  :root{ --bg:#0b1017; --panel:#121a26; --line:#22304a; --muted:#8aa0bd; --cyan:#22d3ee; --blue:#3884ff; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:#e8eef7;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}

  @media (max-width:560px){ #measToggle{left:8px;transform:none;top:60px} #measToggle button{padding:6px 12px} }
  #matbar{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:none;flex-direction:column;gap:8px;align-items:stretch;max-width:96vw}
  #matCats{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}

  @media (max-width:560px){ #card{width:auto;left:2px;right:2px;bottom:58px;max-height:44vh;overflow-y:auto} #card .grid{grid-template-columns:repeat(4,1fr)} body.analyzing #card{display:none!important} #matbar{bottom:58px;left:2px;right:2px;max-width:none;transform:none;justify-content:center} }
</style>

/* 3D billboard label (canvas sprite) for per-facet sq-ft + pitch */
function makeLabel(text){
  const c=document.createElement("canvas"), x=c.getContext("2d");
  x.font="bold 34px system-ui,Segoe UI,sans-serif"; const tw=x.measureText(text).width;
  c.width=Math.ceil(tw)+44; c.height=56;
  x.font="bold 34px system-ui,Segoe UI,sans-serif"; x.fillStyle="rgba(8,14,22,0.85)";
  x.fillRect(0,0,c.width,c.height); x.strokeStyle="rgba(34,211,238,0.7)"; x.lineWidth=2; x.strokeRect(1,1,c.width-2,c.height-2);
  x.fillStyle="#9fe7f5"; x.textBaseline="middle"; x.fillText(text,22,c.height/2+1);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));
  spr.scale.set(c.width/56*2.6, 2.6, 1);
  return spr;
}

    -(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*latR)
    +(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*latR)
    -(35*e2**3/3072)*Math.sin(6*latR));
  const E=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
  let Nn=k0*(M+N*Math.tan(latR)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));
  if(lat<0) Nn+=10000000;

/* ---------- solar position (NOAA-style): azimuth (CW from N) + altitude, degrees ---------- */
function sunPosition(date, lat, lng){
  const rad=Math.PI/180, deg=180/Math.PI;
  const jd=(date.getTime()/86400000)+2440587.5, n=jd-2451545.0, T=n/36525.0;
  let L=(280.46646+36000.76983*T)%360; if(L<0)L+=360;
  const g=(357.52911+35999.05029*T)*rad;
  const lambda=(L+(1.914602-0.004817*T)*Math.sin(g)+0.019993*Math.sin(2*g))*rad;
  const eps=(23.439291-0.0130042*T)*rad;
  const decl=Math.asin(Math.sin(eps)*Math.sin(lambda));
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lambda),Math.cos(lambda));
  let gmst=(280.46061837+360.98564736629*n)%360; if(gmst<0)gmst+=360;
  const H=(gmst+lng)*rad-ra, phi=lat*rad;
  const alt=Math.asin(Math.sin(phi)*Math.sin(decl)+Math.cos(phi)*Math.cos(decl)*Math.cos(H));
  let az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(phi)-Math.tan(decl)*Math.cos(phi));
  az=(az*deg+180)%360;
  return { azimuth:az, altitude:alt*deg };
}

/* bilinear sample of a single-band grid at UTM (E,N) */
function sampleGrid(grid, E, N){
  const {vals,w,h,bbox}=grid;
  const fx=(E-bbox[0])/(bbox[2]-bbox[0])*(w-1);
  const fy=(bbox[3]-N)/(bbox[3]-bbox[1])*(h-1);   // row 0 = north (maxY)
  if(fx<0||fy<0||fx>w-1||fy>h-1) return null;
  const x0=Math.floor(fx),y0=Math.floor(fy),x1=Math.min(x0+1,w-1),y1=Math.min(y0+1,h-1);
  const tx=fx-x0,ty=fy-y0;
  const g=(x,y)=>vals[y*w+x];
  const a=g(x0,y0),b=g(x1,y0),c=g(x0,y1),d=g(x1,y1);
  if(![a,b,c,d].every(v=>isFinite(v)&&v>NODATA)) { const ok=[a,b,c,d].filter(v=>isFinite(v)&&v>NODATA); return ok.length?ok.reduce((s,v)=>s+v,0)/ok.length:null; }
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}

/* true only if (E,N) is at least `margin` metres inside the roof mask (8-dir erosion) —
   keeps every overlay off the roof edge / walls */
function roofInterior(mg,E,N,margin){
  if(!mg) return true;
  if(!(sampleGrid(mg,E,N)>0.5)) return false;
  const d=margin, o=margin*0.707;
  return sampleGrid(mg,E+d,N)>0.5&&sampleGrid(mg,E-d,N)>0.5&&sampleGrid(mg,E,N+d)>0.5&&sampleGrid(mg,E,N-d)>0.5
    &&sampleGrid(mg,E+o,N+o)>0.5&&sampleGrid(mg,E-o,N+o)>0.5&&sampleGrid(mg,E+o,N-o)>0.5&&sampleGrid(mg,E-o,N-o)>0.5;
}

function savingsModel(kwhAc, netCost){
  const rate=0.165, esc=0.035, yrs=25; let cum=0, payback=0; const pts=[];
  for(let n=1;n<=yrs;n++){ cum+=kwhAc*rate*Math.pow(1+esc,n-1); pts.push(cum); if(!payback&&cum>=netCost) payback=n; }
  const max=Math.max(cum,netCost*1.1)||1, W=440,H=150,pad=10;
  const X=n=>pad+(n-1)/(yrs-1)*(W-2*pad), Y=v=>H-pad-(v/max)*(H-2*pad);
  const line=pts.map((v,i)=>(i?"L":"M")+X(i+1).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  const area=line+" L"+X(yrs).toFixed(1)+" "+(H-pad)+" L"+X(1).toFixed(1)+" "+(H-pad)+" Z";
  const svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="margin-top:10px">'+
    '<line x1="'+pad+'" y1="'+Y(netCost).toFixed(1)+'" x2="'+(W-pad)+'" y2="'+Y(netCost).toFixed(1)+'" stroke="#c3ccd8" stroke-dasharray="4 4"/>'+
    '<text x="'+(W-pad)+'" y="'+(Y(netCost)-4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#8493a6">system cost</text>'+
    '<path d="'+area+'" fill="rgba(34,211,238,0.16)"/>'+
    '<path d="'+line+'" fill="none" stroke="#0b8aa0" stroke-width="2.5"/>'+
    (payback?'<line x1="'+X(payback).toFixed(1)+'" y1="'+pad+'" x2="'+X(payback).toFixed(1)+'" y2="'+(H-pad)+'" stroke="#16b6cf" stroke-width="1.5"/>':'')+

  const CE=bc[0], CN=bc[1];

  const clampH=baseY+22;                          // tame extreme tree spikes

    const gp=g.attributes.position, gu=g.attributes.uv;

    if(PinElement){ try{ m.append(new PinElement({ background:"#0b1220", borderColor:"#22d3ee", glyph:"", scale:big?0.5:0.38 })); }catch(_){} }

function panelCornersLL(pn,seg,pw,ph){
  const lat=pn.center.latitude, lng=pn.center.longitude;

      let showing="after"; $("aiToggle").onclick=()=>{ showing=showing==="after"?"before":"after"; img.src=showing==="after"?after:before; $("aiToggle").textContent=showing==="after"?"Before":"After"; };
      $("aiBar").style.display="flex"; btn.style.display="none";
    } else { setStatus(j.error==="no_streetview"?"No street photo for this address yet":"Couldn't render — try again",true); setTimeout(()=>setStatus(""),3500); }
  }catch(e){ setStatus("Render failed — try again",true); setTimeout(()=>setStatus(""),3500); }
  btn.disabled=false; btn.textContent="See it on my house";
};
$("aiBack").onclick=()=>{ hideAI(); $("aiBtn").style.display="block"; };
$("bReset").onclick=()=>{ if(mode==="photoreal"&&gmap){ gmap.flyCameraTo&&gmap.flyCameraTo({endCamera:{center:{lat:SITE.lat,lng:SITE.lng,altitude:siteAlt},range:78,tilt:58,heading:15},durationMillis:900}); return;} if(window.__roofReady){ const d=window.__roofDebug||{}; const span=(d.crop||30)*2; camera.position.set(span*0.48,span*0.62,span*0.72); controls.target.set(0,5,0); controls.update(); } };
$("sTime").addEventListener("input",e=>{ sunHourLocal=+e.target.value; if(window.__roofReady) updateSun(); });
$("sMonth").addEventListener("input",e=>{ sunMonth=+e.target.value; if(window.__roofReady) updateSun(); });
// auto-run on load for fast iteration — skipped with ?noauto=1 (used by the headless /capture so it controls the single search)
if(!new URLSearchParams(location.search).get("noauto")) run($("addr").value.trim());
</script>

  catch(e){ console.warn("roofgeo load failed",e); }
