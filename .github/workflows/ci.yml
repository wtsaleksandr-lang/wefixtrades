name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Fail fast on a hung step instead of stalling indefinitely. The full job
    # (npm ci + ~40 guards + build) runs in ~5 min; 25 is a generous ceiling.
    # A guard that forgot process.exit(0) once hung this job 55+ min before it
    # was manually cancelled — this caps that class of failure.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Typecheck (raised heap — repo is large, default 4GB OOMs)
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm run check:copilot-forms
      - name: Hardcoded color guard
        run: npm run check:hardcoded-colors
      - name: Silent-catch guard
        run: npm run check:no-silent-catch
      - name: Account-deletion coverage guard (the privacy policy promises erasure, so every account-linked table in the live Drizzle metadata must be classified delete/anonymize/keep in shared/accountDeletion/plan.ts; anything kept states a legal basis; nothing we keep holds a blocking FK into something we delete; the computed delete order can never trip a foreign key)
        run: npm run check:account-deletion
      - name: Account-deletion tenant-scoping guard (every generated DELETE is bound to the authenticated user id or to client ids resolved from clients.user_id — never an unscoped statement that would erase another tenant; a client-less account generates no client-scoped delete; the users/clients anchors are anonymised not deleted; deliberate-failure fixture)
        run: npm run check:account-deletion-scope
      - name: Meta signed_request guard (the data-deletion callback Meta App Review requires — HMAC-SHA256 over the encoded payload verified with timingSafeEqual, non-HMAC-SHA256 algorithms rejected, tampered signature / wrong app secret / structural garbage all rejected; deliberate-failure fixture. The test existed but was never wired into CI)
        run: npm run check:meta-signed-request
      - name: Pricing-truth guard (chat AI quotes canonical prices only)
        run: npm run check:pricing-truth
      - name: Trial-truth guard (free tools never pause; honest Pro-preview copy)
        run: npm run check:trial-truth
      - name: Incomplete-signup re-engagement guard (flag-off inertness, ≥24h-no-calc selection, idempotent steps, unsubscribe suppression, batch cap, per-recipient failure isolation)
        run: npm run check:incomplete-signup-emails
      - name: Checkout provisioning-order guard (session first — no phantom rows on session failure)
        run: npm run check:checkout-provisioning-order
      - name: Sub-cancel free-tier guard (cancel reverts to free but never pauses the calculator)
        run: npm run check:cancel-keeps-free-live
      - name: SiteLaunch paid-order notify guard (paid order alerts Alex + creates a 5-day kickoff task, once, SiteLaunch-only)
        run: npm run check:sitelaunch-notify
      - name: SiteLaunch engine guard (renderer emits a standalone responsive page with per-page title/meta/canonical/LocalBusiness JSON-LD; customer + LLM content escaped incl. the JSON-LD block; the 4 themes differ STRUCTURALLY not by colour; brand accent always clears WCAG AA on its own ink; a generated image can never reach a portfolio gallery; domain provisioning reports implemented:false even with the phase-2 flag on; the removed SSL setTimeout simulation can never be reported as an active certificate; drafts never auto-publish and never claim an unsupplied licence/years/reviews)
        run: npm run check:sitelaunch-engine
      - name: Funnel-analytics guard (6 server PostHog funnel events stay instrumented; fire-and-forget no-op contract)
        run: npm run check:funnel-analytics
      - name: SERP-country guard (location string derives the country index)
        run: npm run check:serp-country
      - name: Reviews-providers guard (DataForSEO-primary review chain maps the real DFS/Places shapes + falls through gracefully, never Outscraper-dependent)
        run: npm run check:reviews-providers
      - name: Audit-scoring guard (no false slow-website; blocked-fetch excludes website from denominator not zero-scores it; htmlChecks capped at 8)
        run: npm run check:audit-scoring
      - name: Audit-general guard (non-trade businesses use a real Places category not "general" for competitors/copy; isReal:false instead of a fabricated $; leadNoun is the generic noun; prose never says "general customers")
        run: npm run check:audit-general
      - name: Audit-competitors guard (competitors filtered to the genuine same niche; subject self-excluded by placeId; distanceKm + category exposed and out-of-radius dropped; marketLeader == highest-reviewsCount; detectTrade prefers Places primaryType and is word-bounded)
        run: npm run check:audit-competitors
      - name: Audit-niche guard (name-less businesses resolve a REAL niche via the cascade — layer 1 Places → layer 2 website-text → layer 3 LLM → honest suppression; cost guard fires layer 3 only when 1+2 miss; never fabricates, never "general")
        run: npm run check:audit-niche
      - name: Audit-narrative guard (premium AI narrative via background-merge job — parseNarrativeJSON recovers clean/fenced/truncated output, buildNarrativePatch shapes it + reports ready/failed, isReal $-gating preserved so no fabricated dollar figure)
        run: npm run check:audit-narrative
      - name: Audit-premium guard (premium value-first data block — comparison rank math, GBP completeness pct + missing list, on-page checks null without HTML, reviewDepth null without review data, KPI tiles omit absent sources; nothing fabricates a value)
        run: npm run check:audit-premium
      - name: Revenue-loss guard (honest per-business loss — real demand-gap or avg-ticket floor; isReal:false instead of a fake placeholder when zero)
        run: npm run check:revenue-loss
      - name: Pricing-engine guard (all 10 pricing models; applyModifiers order — travel → after-hours × → difficulty × → add-ons → min-charge clamp; invalid config degrades to call_for_quote not a wrong price; hostile quantity never yields NaN/negative)
        run: npm run check:calculate-estimate
      - name: Formula-engine guard (no eval/new Function in the source; PEMDAS + right-assoc ^; all 17 functions; runCalculations chaining; malformed input never throws; overflow REFUSES to quote instead of silently returning $0)
        run: npm run check:formula-engine
      - name: QuoteQuick entitlement guard (feature→tier map matches the shared/pricing.ts bullets; unknown/blank plan_tier fails CLOSED; grandfathering is per-feature; allow-map agrees with the direct checks)
        run: npm run check:qq-entitlements
      - name: Quote-recompute guard (tampered quote_amount is corrected to the server value; the ADVANCED formula path is skipped not recomputed; call-for-quote/roof-visualiser/null are never zeroed; never throws)
        run: npm run check:quote-recompute
      - name: Calculator-schema guard (advanced.fields[].type enum stays in sync with the 19-type FieldType union; bogus type rejected)
        run: npm run check:calculator-schema
      - name: Template formula-ref guard (every bracketed [ref] + result_calc in a preset resolves to a real field/calc name; unknown ref silently → 0 wrong quote, the door_installation class)
        run: npm run check:template-formula-refs
      - name: Template image-host guard (no preset references the dead source.unsplash.com redirector → broken image cards on the conversion widget)
        run: npm run check:template-image-hosts
      - name: Template thumbnail-coverage guard (every preset ships a committed non-empty pre-rendered @2x.png so the premium gallery uses the real snapshot, not the data-driven fallback; a new template added without regenerating thumbnails fails here. Regenerate via `npx vite --port 5321` + `RENDER_BASE_URL=http://localhost:5321 npm run thumbnails`)
        run: npm run check:template-thumbnails
      - name: Quote-widget distance guard (cache hit = 1 upstream call; no-key/quota soft-fail not 500; DM mapping; origin geocode-on-save)
        run: npm run check:quote-widget-distance
      - name: Quote-widget upload guard (magic-byte allowlist not filename; 8MB/field cap; per-IP min+day quota; cheap authz; junk never burns daily budget)
        run: npm run check:quote-widget-upload
      - name: RoofQuote cost-gating guard (public /api/roofquote/* — per-IP min+day caps on the paid /airender, per-calc/day embed cap, shared per-IP Google-read cap; normal session passes, loop trips 429)
        run: npm run check:roofquote-cost-gating
      - name: Client-chat access guard (free-activated widget AI proceeds on pinned Haiku; disabled → 403; per-calc daily conv cap → graceful 503; trial machinery dormant)
        run: npm run check:client-chat-access
      - name: Portal overview guard (dashboard leads-series scopes calculators by user_id — there is no calculators.client_id; c.client_id 500'd the whole client dashboard for every client)
        run: npm run check:portal-overview
      - name: WebCare honest-KPI guard (no KPI scored from never-written metadata; unmeasured security/performance/backups report null not 0/F; empty uptime history is unknown not 100%; monthly digest omits an unmeasured grade)
        run: npm run check:webcare-honest-kpis
      - name: Citation-evidence guard (unimplemented or credential-gated directories are skipped not reported "not found"; a failed scrape or bot-wall interstitial is never a removal; removed_listing needs 2 consecutive confirmed negatives; every excluded directory records why; the Google field mask stays on the free SKU tier; marketing names the directories it checks)
        run: npm run check:citation-evidence
      - name: Citation-scraper contract (each scraper distinguishes "not found" from "could not check" — challenge pages, timeouts, quota exhaustion and unrecognised markup all surface as errors, while only a cleanly parsed empty result counts as absence)
        run: npm run check:citation-scrapers
      - name: Free Citation Checker honesty guard (the public tool reads the SAME registry the paid product reads, never a private directory list; every scraper failure maps to could-not-check not absence; no SERP call and no paid opt-in; per-IP cap, a process-wide daily ledger on the one billable Places call, and a bounded response cache; the page names every directory it checks and claims none it declines)
        run: npm run check:citation-checker-honesty
      - name: Citation SERP-matcher guard (a directory absent from the top ten organic results is unable-to-check, never a reported absence; wrong-city and category pages stay unverified)
        run: npm run check:citation-match
      - name: Citation Builder fulfilment-honesty guard (the paid one-time service can only tell a customer what an operator recorded — progress is DERIVED from citation_builder_directory_tasks rows and no route accepts a count; "live" needs its listing URL and a rejection needs a reason; the progress email fires on the first real submission not on purchase, "start" or any timer, and is idempotent; completion is refused unless every directory has an outcome and at least one is live; both emails have exactly one caller; and every tier number sold matches the registry the operator's checklist is cut from, so the copy cannot outrun the work. Deliberate-failure fixture)
        run: npm run check:citation-builder-fulfilment
      - name: Citation robots-compliance guard (every scraper's real URL builder is evaluated against the target's recorded robots.txt with an RFC 9309 matcher; a disallowed path is refused before the socket and surfaces as could-not-check never as absence; unrecorded hosts fail closed; BBB stays declined and the public Nominatim instance stays refused)
        run: npm run check:citation-robots
      - name: MapSnapshot rank-honesty guard (public snapshot never publishes an unmeasured rank; RNG grid + invented audit cards stay deleted; legacy synthetic rows downgraded on read; anonymous visitors cannot reach a paid SERP provider)
        run: npm run check:mapsnapshot-rank-honesty
      - name: Public SERP spend-cap guard (MONTHLY_LIMIT 0 means NO free allowance not unlimited, so the quota gate can actually bind the one provider that bills; paid providers are DEFAULT-DENY — reachable only via an explicit allowPaidProviders opt-in, which no public/anonymous surface carries; the free rank-grid keeps a bounded per-IP + per-day fan-out and degrades unfunded points to "unavailable" with no number)
        run: npm run check:public-serp-spend
      - name: AdFlow action-honesty guard (no "campaign paused" claim without an ad-platform integration; requests create a real fulfillment task; @example.com suppliers blocked on both assign + send; MapGuard grid never fabricates pin geography)
        run: npm run check:adflow-action-honesty
      - name: RankFlow honesty guard (no canned "completed by AI engine" proof — the 4 stubbed task types run real executors and un-automatable ones become real manual tasks; only deliverable_ready auto-approves; a HEAD 200 is reachability NOT "indexed by Google"; KPI charts render an empty state instead of a synthetic rank climb, server AND client; executors never opt into paid SERP)
        run: npm run check:rankflow-honesty
      - name: TradeLine route-order guard (literal /knowledge,/voices,/settings must not be shadowed by the :clientServiceId param route → no NaN 400; numeric ids still served)
        run: npm run check:tradeline-route-order
      - name: TradeLine number-unification guard (client's Twilio number → Vapi inbound URL not the dead route; Vapi import payload carries number+creds+assistant not a fresh BUY; readiness honest when assistant absent)
        run: npm run check:tradeline-unify
      - name: TradeLine provisioning entitlement gate (a paid Twilio number purchase requires an active tradeline subscription; existence-only so a paying client is never blocked mid-setup)
        run: npm run check:tradeline-entitlement
      - name: Matrix-rate guard (resolveMatrixRate — full cell / unselected undefined / missing-cell null both rules / single-axis / formula composition)
        run: npm run check:matrix-rate
      - name: Trades-sync guard (client/src/site/trades.ts stays in lock-step with SolutionPage route slugs — count + membership + roofWidget flag)
        run: npm run check:trades-sync
      - name: Style-drop integrity guard (set_style RETURNS dropped invalid colour/radius/font keys so the chat surfaces them honestly; all-valid patch reports nothing)
        run: npm run check:style-drop
      - name: Wizard field-types guard (public↔engine round-trip, makeField factories, SSR of distance/matrix/photo runtime fields)
        run: npm run check:wizard-field-types
      - name: Wizard template-apply guard (card tap always applies; every gallery template applies to a non-empty preview; fresh seed needs no confirm)
        run: npm run check:wizard-template-apply
      - name: Body-limit preemption guard (every raised-limit path mounted AHEAD of the global 100KB parser; big bodies reach routes; over-limit 413s; untouched paths stay strict)
        run: npm run check:body-limit-preemption
      - name: Demo-persona guard (TradeLine demo role-plays the receptionist, not the platform)
        run: npm run check:demo-persona
      - name: ContentFlow generate-source guard (saved custom prompts can drive generation — not template-bound)
        run: npm run check:contentflow-generate-source
      - name: ContentFlow reference-replication guard (photoreal augmentation + reference vision-describe→generate)
        run: npm run check:contentflow-reference-replication
      - name: QuoteQuick fusion guard (text+image → vision model, tools stay available, text-first blocks)
        run: npm run check:quotequick-fusion
      - name: ContentFlow reference-capture guard (Playwright webpage screenshot — SSRF gate, og:image fallback, height cap)
        run: npm run check:contentflow-reference-capture
      - name: ContentFlow Imagen 4 guard (dimension→aspect mapping, standard/ultra cost, graceful skip without creds)
        run: npm run check:contentflow-imagen4
      - name: ContentFlow FLUX.2 pro guard (fal auth/body shape, MP-based cost, 4MP clamp, graceful skip without FAL_KEY)
        run: npm run check:contentflow-flux2
      - name: ContentFlow Gemini 2.5 Flash Image guard (API-key endpoint/body shape, inline_data decode, flat cost, graceful skip without GEMINI_API_KEY, order wiring)
        run: npm run check:contentflow-gemini
      - name: ContentFlow video-storage guard (SKIP LOCKED claims, stale recovery, dual-write cost invariant, idempotent create)
        run: npm run check:contentflow-video-storage
      - name: ContentFlow video-director guard (scene plan invariants — sum==total, styleBible injection, narration budget, tier clamps)
        run: npm run check:contentflow-video-director
      - name: ContentFlow video-providers guard (Veo/Kling submit-poll contract, 429 retryable, env-skip)
        run: npm run check:contentflow-video-providers
      - name: ContentFlow video-stitcher guard (selection ladder + no whole-clip memory buffering)
        run: npm run check:contentflow-video-stitcher
      - name: ContentFlow video-worker guard (flag inertness, gate-blocked poll-only, double-spend resubmit guard, cost ceiling, stitch happy path)
        run: npm run check:contentflow-video-worker
      - name: ContentFlow video-routes guard (estimate math + cost-cap precheck, tier-cap clamp, idempotency, 402 upgrade shape)
        run: npm run check:contentflow-video-routes
      - name: ContentFlow intake-sufficiency guard (brief extraction/fills/scoring, placement-first ask, composeBriefLayer rules, no-regression byte-identical no-intake assembly)
        run: npm run check:contentflow-intake
      - name: SEO engine foundation guard (published-only visibility, Article JSON-LD author entity, sitemap real-lastmod, flag + kill-switch gate, deliberate-failure fixture)
        run: npm run check:seo-engine
      - name: SEO OriginalDataService guard (aggregation math, k-anonymity/anti-thin gate below MIN_SAMPLE, no-PII output shape, deliberate-failure fixture)
        run: npm run check:seo-original-data
      - name: SEO article-generator guard (below-floor skips, in_review never auto-publishes, cites real data + CTA + internal links, flag-off inert, deliberate-failure fixture)
        run: npm run check:seo-generator
      - name: SEO programmatic-matrix guard (k-anonymity skip → no page, in_review never auto-publishes, dedup, limit respected, flag-off inert, deliberate-failure fixture)
        run: npm run check:seo-matrix
      - name: Client-knowledge guard (HARD audience tiers — customer block provably excludes margin formula constants + internal notes, red-proof vs unfiltered block; token-only degrade; audience-keyed 60s cache; KB truncation; injection framed as data + delimiter red-proof)
        run: npm run check:client-knowledge
      - name: TradeLine chat↔voice parity guard (chat carries SAFETY_FLOOR+PII_GUARD+closer via the shared tail; voice renders the assembled customer-audience business-data block beneath the floor)
        run: npm run check:tradeline-parity
      - name: TradeLine safety-floor guard (live prompt carries the unconditional emergency-escalation block + absolute-precedence line for matched/unmatched/empty trade; hostile owner KB cannot remove, weaken, or reorder it)
        run: npm run check:tradeline-safety
      - name: TradeLine voice booking-actuation guard (a booking-intent voice turn ACTUALLY reaches the create_booking executor + persists a row with caller-ID-defaulted callback number + reads the confirmation back; would be red on the old tool-less assistantSync path)
        run: npm run check:tradeline-booking
      - name: TradeLine chat booking-actuation guard (PR6 — a booking-intent CHAT turn reaches the create_booking executor + persists a bookflow_appointments row tagged source=tradeline_chat via the tool-capable agent loop; gated/disabled client stays lead-capture and NEVER books; deliberate-failure fixture — the old tool-less assistantSync path makes the executor structurally unreachable → red)
        run: npm run check:tradeline-chat-booking
      - name: Booking façade guard (PR2 — consolidation seam routes to the bookflow store NOT bookings/scheduled_appointments; calc→client resolver; numeric working_days→named-day working_hours projection over all 7 days; ensureBookflowSettings idempotent; unresolved client throws, never lands a row)
        run: npm run check:booking-facade
      - name: Widget scheduling BookFlow guard (PR3 — wizard "Online booking" picker POST /book lands a bookflow_appointments row tagged source=quotequick and provably NOT scheduled_appointments; availability reads the same bookflowService source; inactive BookFlow / no-client → clean 409 not 500)
        run: npm run check:widget-scheduling-bookflow
      - name: QuoteQuick copilot booking guard (PR4 — customer-widget AI copilot book_appointment lands a bookflow_appointments row tagged source=quotequick and provably NOT scheduled_appointments; propose_appointment_times reads the same bookflowService source; inactive BookFlow / no-client → ok:false unavailable not a throw; requireEmail identity guard preserved)
        run: npm run check:copilot-booking
      - name: Legacy booking-step BookFlow guard (PR7 — the legacy wizard BookingStep POST /api/bookings routes the NON-DEPOSIT case to a bookflow_appointments row tagged source=quotequick and provably NOT the `bookings` table; the DEPOSIT case STILL writes `bookings` status=pending + requires_checkout via Stripe and provably does NOT hit the façade; inactive BookFlow / no-client → clean 4xx not 500; availability reads the same bookflowService source as HH:MM)
        run: npm run check:legacy-booking-bookflow
      - name: Admin recent-bookings BookFlow read guard (PR8 — GET /api/admin/booking/recent reads the UNIFIED bookflow_appointments table and surfaces quotequick + tradeline_* rows projected onto the legacy {date,time,service} shape; deliberate-failure fixture — the legacy `bookings` reader is a sentinel spy proven NEVER called so it reds the instant the read reverts; PART 2 — bookflowService throws a typed BookflowInactiveError(reason:'inactive') recognised by callers WITHOUT message-string matching, with the legacy string kept as a back-compat fallback)
        run: npm run check:admin-recent-bookflow
      - name: TradeLine day-one KB-seeding guard (activation seeds the full per-trade starter FAQ set as customer-tier faq rows marked starter_default, no fabricated $-price/guarantee — unknowns defer; idempotent via deterministic ids; owner onboarding answer overrides + archives the matching starter default)
        run: npm run check:tradeline-kb-seeding
      - name: Availability-rule projection guard (calculator create/update projects appearance.scheduling into the availability_rules table the live scheduling picker reads; enabled:true AND enabled:false both persist; would be red on the old code where nothing wrote the table → dead toggle)
        run: npm run check:availability-sync
      - name: BookFlow working-hours sync guard (P0 — calculator create/update UPSERTS appearance.scheduling into bookflow_settings.working_hours, the table the LIVE slot picker + QuoteQuick copilot actually read via bookflowService.getAvailableSlots; an EXISTING row is UPDATED not lazy-once-frozen; only working_hours/slot/buffer touched so deposit/slug/is_active are preserved; enabled-falsy / no-client → no-op; deliberate-failure fixture — a lazy-only impl never updates → red)
        run: npm run check:bookflow-hours-sync
      - name: Affiliate dashboard aggregation guard (buildAffiliateDashboard turns raw click/signup/commission aggregates into the correct tier/rate/earnings view-model using only programs.ts terms; base <10 counts toward pro, pro is top-of-ladder, hand-set partner rate wins, commission rows bucket into pending/approved/paid, garbage clamps to 0)
        run: npm run check:affiliate-dashboard
      - name: Affiliate self-serve signup guard (registerAffiliate is idempotent on email — a repeat submit returns the existing row with no mint/insert; a new email mints a code and inserts tier=base/status=pending at the base commission rate; owner + payout fields flow through; a no-row insert throws; the route Zod shape rejects bad email/payout method)
        run: npm run check:affiliate-signup
      - name: Affiliate admin-update guard (PATCH /api/admin/affiliates/:id Zod shape rejects out-of-enum status/tier + out-of-range/non-numeric commission_rate + empty body; computeAffiliateUpdate writes only changed fields with a correct before→after audit diff and treats an unchanged field as a no-op)
        run: npm run check:affiliate-admin
      - name: Product-catalog pricing-CTA routing guard (every PRODUCT_PAGES "See pricing" CTA deep-links to /pricing#price-<id>, never bare /pricing)
        run: npm run check:product-cta-routing
      - name: Routed-page pricing-CTA deep-link guard (per-product demo/detail/suite pages + product-mockups/comparisons/siteMap catalogs never bare-link /pricing; every #price-<id> anchor resolves to a real card)
        run: npm run check:pricing-cta-deeplink
      - name: Cookie-parser referral guard (req.cookies is populated so wft_ref attribution links at signup — proven from a real Cookie header, not injected)
        run: npm run check:cookie-parser
      - name: Apple referral-hook guard (the Apple signup branch mints a referral code + links attribution like the password/Google paths)
        run: npm run check:apple-referral
      - name: Layout rules guard
        run: npm run check:layout-rules
      - run: npm run check:migrations
      - name: Migration SQL destructive-op guard
        run: npm run check:migration-safety
      - name: Forbid schema-push command in any deploy path
        run: npm run check:no-db-push-in-prod
      - name: Forbid GA4 Measurement Protocol secret in client bundle
        run: npm run check:no-mp-secret-in-client
      - name: Drizzle schema-drift check
        run: npm run check:schema-drift
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
      - run: npm run check:database-url
      # Wave 96 — CI runs on ubuntu-latest without the Playwright browser
      # bundle, so headless Chromium can't launch. SKIP_PRERENDER=1 skips the
      # per-route prerender step + the build-smoke check (the smoke check
      # would FAIL for any non-template-fallback route since prerender didn't
      # run). Replit production builds do NOT set this flag — strict prerender
      # + smoke validation still runs on every real deploy.
      - run: npm run build
        env:
          SKIP_PRERENDER: "1"
