name: Staging Gate

# Deploy Safety Wave 3 — pre-prod smoke gate. Reworked by CI-QUIET (2026-06-11).
#
# REALITY THIS WORKFLOW NOW RESPECTS: staging.wefixtrades.com is ONE rolling
# slot ("last PR wins"), not per-branch staging. Concurrent PRs displace each
# other, Replit staging rebuilds take longer than any sane in-job wait, and the
# slot can be down entirely. The old design hard-failed the gate on EVERY PR
# (~5 min burn + 2-3 bot comments + a failure email per push) even though the
# failure said nothing about the PR's code — only that the shared slot wasn't
# serving it.
#
# NEW CONTRACT:
#   1. Still force-push the PR head to the `staging` branch (keeps the rolling
#      staging pipeline converging on the newest PR).
#   2. FAST freshness pre-check: poll staging /api/healthz briefly. The gate
#      only proceeds when staging PROVABLY serves THIS PR's commit
#      (STRICT_VERSION — an unverifiable build is treated as stale; we never
#      smoke-test someone else's code and report it as this PR's verdict).
#   3. Staging not serving this commit → exit SUCCESS with a notice
#      ("staging not serving this commit — gate skipped"). No comment, no
#      email. Truthful: the gate has no evidence either way.
#   4. Staging IS serving this commit → run the smoke suite against it.
#      Failure here is a REAL signal: the job fails and posts ONE failure
#      comment.
#
# Comment policy (CI-QUIET): no "started" comment, no success comment, at most
# ONE displacement notice per displaced PR (deduped via marker), one failure
# comment only when staging served the commit AND checks failed.
#
# The pre-build (tsc + build) and schema-drift steps were removed from this
# gate: ci.yml's `build` job runs the exact same commands as a HARD merge gate
# on every PR — duplicating them here only doubled the burn.
#
# TODO(per-branch staging): when per-branch staging URLs exist, restore this
# workflow as a hard-failing merge gate (require `staging-gate / gate` in
# branch protection) and drop the freshness skip.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel the previous gate run for the same PR when a new commit lands.
# Group key is the PR number so different PRs don't cancel each other.
concurrency:
  group: staging-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write       # to force-push the staging branch
  pull-requests: write  # to comment on PRs (failure + displacement notices)
  issues: write         # PR comments are issues under the hood

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Allow drafts to skip the gate (they'll re-run on ready_for_review).
    if: ${{ !github.event.pull_request.draft }}

    env:
      STAGING_URL: ${{ vars.STAGING_URL || 'https://staging.wefixtrades.com' }}
      STAGING_BRANCH: staging
      HEALTHZ_TIMEOUT_S: "90"

    steps:
      - uses: actions/checkout@v4
        with:
          # PR head, not the merge commit — we deploy what the author wrote.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Use a token that can force-push protected branches if `staging`
          # is protected later. Falls back to GITHUB_TOKEN.
          token: ${{ secrets.STAGING_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Both staging-gate scripts below use node built-ins only — no npm ci
      # needed on the fast path. Dependencies install only when the freshness
      # pre-check proves staging serves this PR's commit.

      - name: Identify previous staging occupant
        id: prev
        run: node scripts/staging-gate/identify-previous-occupant.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STAGING_BRANCH: ${{ env.STAGING_BRANCH }}
          CURRENT_PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Force-push PR head to staging branch
        # This is what nudges the staging Replit toward this PR. The Replit is
        # one-time configured to auto-deploy from the `staging` branch.
        run: node scripts/staging-gate/push-to-staging.mjs
        env:
          STAGING_BRANCH: ${{ env.STAGING_BRANCH }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Displacement notice on previous PR (max one, deduped)
        if: steps.prev.outputs.previous_pr != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prev = Number('${{ steps.prev.outputs.previous_pr }}');
            const current = ${{ github.event.pull_request.number }};
            const marker = '<!-- staging-gate:displacement -->';
            // CI-QUIET: at most ONE displacement notice per displaced PR.
            // Every subsequent displacement is the same information — the
            // rolling slot moved on — and repeating it is pure inbox noise.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prev,
              per_page: 100,
            });
            if (comments.some((c) => c.body && c.body.includes(marker))) {
              core.info(`PR #${prev} already carries a displacement notice — not repeating it`);
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prev,
              body: [
                marker,
                `Rolling staging is a single shared slot and has moved on (currently #${current}).`,
                ``,
                `This notice is posted once per PR. Re-push or re-run the staging gate when you want this branch back on staging.`,
              ].join("\n"),
            });

      - name: Freshness pre-check — is staging serving THIS commit?
        id: fresh
        # STRICT_VERSION: only a healthz `version` that provably matches the
        # PR head counts. status=ok with version "unknown" is somebody's
        # build, not evidence about this PR.
        run: node scripts/staging-gate/wait-for-staging.mjs
        continue-on-error: true
        env:
          STAGING_URL: ${{ env.STAGING_URL }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          TIMEOUT_S: ${{ env.HEALTHZ_TIMEOUT_S }}
          STRICT_VERSION: "1"

      - name: Gate skipped — staging not serving this commit
        if: steps.fresh.outcome != 'success'
        run: |
          echo "::notice::staging not serving this commit — gate skipped (single rolling staging slot; PRs displace each other). ci.yml build remains the hard merge gate."
          {
            echo "## Staging gate skipped"
            echo ""
            echo "Staging (${STAGING_URL}) is not serving this PR's commit — it is a single rolling slot shared by all PRs."
            echo ""
            echo "- No verdict is implied about this PR's code."
            echo "- The hard merge gate is ci.yml's \`build\` job (tsc + guards + build)."
            echo "- To get a real staging smoke verdict: re-run this workflow once staging has converged on this commit."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- Everything below runs ONLY when staging provably serves ----------
      # ---------- this PR's commit — a real, attributable smoke verdict.  ----------

      - name: Install deps
        if: steps.fresh.outcome == 'success'
        run: npm ci

      - name: Install Playwright chromium
        if: steps.fresh.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite against staging
        if: steps.fresh.outcome == 'success'
        # Reuses tests/smoke/critical-paths.spec.ts + smoke.config.ts.
        # SMOKE_BASE_URL flips it from prod to staging.
        run: npm run smoke:critical
        env:
          SMOKE_BASE_URL: ${{ env.STAGING_URL }}

      - name: Upload smoke results
        if: always() && steps.fresh.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-results-pr-${{ github.event.pull_request.number }}
          path: |
            tests/smoke/results.json
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment failure on PR (real failure only)
        # CI-QUIET: the ONLY comment this workflow leaves on the current PR.
        # Fires only when staging WAS serving this commit and the checks then
        # failed — an attributable, actionable signal.
        if: failure() && steps.fresh.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              body: [
                `Staging gate **FAILED** for \`${context.sha.substring(0,7)}\` — staging was serving this commit and the smoke checks failed.`,
                ``,
                `Workflow: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
                ``,
                `First triage step: hit ${process.env.STAGING_URL}/api/healthz and look for the \`status: down\` sub-check, or open the smoke artifact attached to the workflow run.`,
                ``,
                `**Do not merge until this is understood.**`,
              ].join("\n"),
            });
        env:
          STAGING_URL: ${{ env.STAGING_URL }}
