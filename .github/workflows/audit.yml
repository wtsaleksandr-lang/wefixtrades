name: Audit

# Visual + accessibility audit of the built client. Runs against the static
# build served by `vite preview` — no database, server or secrets needed.
#
# CI-QUIET (2026-06-11): all jobs in this workflow are REPORT-ONLY
# (continue-on-error at job level) and hard-capped with timeout-minutes.
# Before this change the a11y/visual job burned ~2 HOURS per run before
# failing, and the two Lighthouse "hard-fail" jobs failed threshold
# assertions on every PR AND every main push — together several failure
# emails per merge, none of them actionable as merge gates because they run
# against the local vite-preview build (no per-branch staging exists to give
# them a stable, production-like target).
#
# Report-only means: artifacts (audit-report, Lighthouse uploads) are still
# produced and the per-job red/green is still visible inside the run, but
# the workflow run itself concludes SUCCESS — no failure email, no red X on
# the PR. ci.yml's `build` job (tsc + check:* guards + build) remains the
# hard merge gate and is untouched.
#
# TODO(re-harden): once per-branch staging exists (each PR gets its own
# staging URL serving its own commit), point these jobs at that URL and
# remove the continue-on-error lines so Lighthouse + a11y become hard gates
# again — at that point their failures will be attributable to the PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the visual baselines and commit them
        type: boolean
        default: false

jobs:
  a11y-visual:
    name: Accessibility + visual regression (report-only)
    runs-on: ubuntu-latest
    # CI-QUIET: report-only + hard runtime cap. This job historically hung
    # for ~2h (per-test 120s timeout x retries across the route matrix)
    # before failing. 30 min is enough for a healthy pass; anything longer
    # is the hang pattern and gets cut off without failing the run.
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Wave 96 — skip the per-route prerender + smoke test in CI. Chromium
      # under the Playwright container has historically failed to launch
      # cleanly here (missing Mesa/Nix libs), and the smoke test then fails
      # on routes without static-template fallbacks. The visual + a11y tests
      # below drive the hydrated SPA, so they don't need the prerendered
      # HTML to be present. Replit production builds enforce strict
      # prerender + smoke.
      - run: npm run build
        env:
          SKIP_PRERENDER: "1"

      # Are visual baselines already committed?
      - id: baselines
        run: |
          if find tests/audit -name '*.png' -type f 2>/dev/null | grep -q .; then
            echo "exist=true" >> "$GITHUB_OUTPUT"
          else
            echo "exist=false" >> "$GITHUB_OUTPUT"
          fi

      # Normal run — compare against the committed baselines.
      - name: Audit — accessibility + visual regression
        if: ${{ steps.baselines.outputs.exist == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.update_snapshots) }}
        run: npx playwright test --config audit.config.ts

      # Bootstrap (no baselines yet) or a requested refresh — regenerate them.
      - name: Generate visual baselines
        if: ${{ steps.baselines.outputs.exist == 'false' || (github.event_name == 'workflow_dispatch' && inputs.update_snapshots) }}
        run: npx playwright test --config audit.config.ts --update-snapshots

      - name: Commit baselines
        if: ${{ steps.baselines.outputs.exist == 'false' || (github.event_name == 'workflow_dispatch' && inputs.update_snapshots) }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/audit
          if git diff --cached --quiet; then
            echo "baselines unchanged"
          else
            git commit -m "chore(quotequick): visual audit baselines"
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: audit-report/
          retention-days: 14

  # SEO Wave C — Lighthouse CI threshold assertions.
  # Asserts performance / accessibility / best-practices / SEO category scores
  # on every critical marketing route, on both mobile and desktop form
  # factors. See lighthouserc.cjs and
  # docs/operations/seo-wave-c-lighthouse-thresholds.md.
  #
  # CI-QUIET: report-only (was "hard-fail"). The assertions run against the
  # local vite-preview build on a shared CI runner — scores there are noisy
  # and failed on every single run, emailing on every PR and merge. Scores +
  # uploaded reports remain available in the run. Re-harden once per-branch
  # staging gives these a production-like target (see header TODO).
  lighthouse:
    name: Lighthouse (${{ matrix.form_factor }}) — report-only
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        form_factor: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Wave 96 — see ci.yml comment. The Lighthouse job runs on plain
      # ubuntu-latest with no Playwright browser bundle, so prerender can't
      # launch Chromium. Lighthouse crawls the hydrated SPA via vite preview,
      # so it doesn't need prerendered head tags to validate scores. Replit
      # production builds enforce strict prerender + smoke.
      - run: npm run build
        env:
          SKIP_PRERENDER: "1"
      - name: Serve the static build
        run: |
          npx vite preview --port 5000 --strictPort &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/ >/dev/null && break
            sleep 2
          done
      - name: Lighthouse CI (assert thresholds)
        uses: treosh/lighthouse-ci-action@v12
        with:
          # URLs, runs, thresholds, and form-factor preset all come from
          # lighthouserc.cjs. The config reads LHCI_FORM_FACTOR to pick
          # mobile vs desktop and apply the matching perf threshold.
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_BASE_URL: http://localhost:5000
          LHCI_FORM_FACTOR: ${{ matrix.form_factor }}
