name: Post-Deploy Watchdog

# Deploy Safety Wave 4 — reworked by CI-QUIET (2026-06-11).
#
# REALITY THIS WORKFLOW NOW RESPECTS: Replit prod publishes are MANUAL.
# A push to `main` is STAGED code, not a deploy — Alex clicks Publish later
# (sometimes hours later, sometimes batching many merges into one publish).
# The old design assumed push == auto-deploy, so it verified the live (stale)
# build after every merge and FAILED every time: a failure email + GitHub
# issue per merge, all noise — which then masked a genuinely stuck publish.
#
# NEW CONTRACT — on every main push:
#   1. DETECT (scripts/deploy/detect-publish.mjs): poll prod /api/healthz for
#      up to ~10 min looking for a publish pickup:
#        - pickup=version  — healthz `version` stamp matches the pushed SHA
#                            (provable; requires the GIT_SHA build stamp —
#                            until that ships prod reports version:"unknown").
#        - pickup=movement — boot_time (or the version string) changed during
#                            the window: a publish/restart happened, build
#                            identity unproven.
#        - pickup=none     — nothing changed: the push is simply not deployed
#                            yet. NEUTRAL EXIT (success + notice). No email.
#   2. VERIFY only when a pickup was detected:
#        - healthz stability (rollback-monitor) — unhealthy prod after a
#          publish FAILS loudly (issue + rollback PR + failed run) for any
#          pickup kind. This is the one signal worth an email.
#        - content verification — full fail path (issue + failed run) only
#          when the build is attributable (pickup=version, or the operator
#          asserted the publish via the assume_published dispatch input);
#          with an unattributable movement-pickup it reports a WARNING +
#          artifact only.
#
# Note: Replit's own "Published your App" commit lands on main when Alex
# publishes, so real publishes DO produce a push event → that run's detect
# window is the one that sees movement and verifies the fresh build.
#
# AFTER A MANUAL PUBLISH you can demand a full verification immediately:
#   gh workflow run post-deploy-watchdog.yml -f assume_published=true
#
# Prod outages with NO publish involved are the scheduled Post-Deploy Verify
# workflow's job (15-min cadence, deduped issue) — not this watchdog's.
#
# Replit has no programmatic rollback API, so the revert PR remains the
# rollback mechanism; merging it stages the older code for Alex's next
# Publish click. Deliberately NOT auto-merged.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_url:
        description: "Base URL to watch"
        required: false
        default: "https://wefixtrades.com"
      assume_published:
        description: "Operator just clicked Publish — skip pickup detection and verify the live build now"
        type: boolean
        required: false
        default: false

concurrency:
  # Serialize per-branch so a rapid second push waits for the first watchdog
  # run instead of racing against it (which would risk two revert PRs).
  group: post-deploy-watchdog-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # to create the revert branch
  pull-requests: write  # to open the revert PR
  issues: write         # to file the rollback issue

jobs:
  watch:
    name: watch
    runs-on: ubuntu-latest
    timeout-minutes: 30  # detect window (~10 min) + monitor (~10 min) + content

    env:
      DEPLOY_URL: ${{ github.event.inputs.deploy_url || 'https://wefixtrades.com' }}
      DEPLOYED_SHA: ${{ github.sha }}
      # Attributability: content-verification failures only fail the run when
      # we can pin the live build to this push (version stamp) or the operator
      # asserted the publish. Movement-only pickups warn instead.
      ASSUME_PUBLISHED: ${{ github.event.inputs.assume_published == 'true' && 'true' || 'false' }}

    outputs:
      pickup: ${{ steps.detect.outputs.pickup }}
      verdict: ${{ steps.monitor.outputs.verdict }}
      reason: ${{ steps.monitor.outputs.reason }}
      failed_check: ${{ steps.monitor.outputs.failed_check }}
      failed_status: ${{ steps.monitor.outputs.failed_status }}
      previous_sha: ${{ steps.prev.outputs.previous_sha }}
      previous_sha_short: ${{ steps.prev.outputs.previous_sha_short }}
      content_verdict: ${{ steps.content.outputs.content_verdict }}
      content_reason: ${{ steps.content.outputs.content_reason }}
      content_failed_route: ${{ steps.content.outputs.content_failed_route }}
      content_failed_assertion: ${{ steps.content.outputs.content_failed_assertion }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need HEAD~1 to compute the previous-good SHA

      - name: Resolve previous-good SHA
        id: prev
        # For a regular commit, parent #1 is the prior tip of main. For a merge
        # commit (squash-merges land as one commit so this doesn't usually fire,
        # but defend anyway), parent #1 is still the previous main tip — parent
        # #2 is the merged feature branch. Either way, ^1 is correct.
        run: |
          PREV=$(git rev-parse "${DEPLOYED_SHA}^1")
          echo "previous_sha=${PREV}" >> "$GITHUB_OUTPUT"
          echo "previous_sha_short=${PREV:0:7}" >> "$GITHUB_OUTPUT"
          echo "deployed=${DEPLOYED_SHA:0:7}  previous=${PREV:0:7}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No npm cache: all watchdog scripts use node built-ins, no install needed.

      - name: Detect publish pickup (manual-publish aware)
        id: detect
        # Always exits 0; the pickup output drives everything downstream.
        run: node scripts/deploy/detect-publish.mjs
        env:
          DEPLOY_URL: ${{ env.DEPLOY_URL }}
          EXPECTED_SHA: ${{ env.DEPLOYED_SHA }}
          TIMEOUT_S: "600"
          POLL_INTERVAL_S: "20"
          ASSUME_PUBLISHED: ${{ env.ASSUME_PUBLISHED }}

      - name: Neutral exit — prod publish is manual, push not yet deployed
        if: steps.detect.outputs.pickup == 'none'
        env:
          DETECT_DETAIL: ${{ steps.detect.outputs.detail }}
        run: |
          echo "::notice::prod publish is manual — ${DEPLOYED_SHA:0:7} not picked up within the window; watchdog has nothing to judge. ($DETECT_DETAIL)"
          {
            echo "## Watchdog: nothing to judge (neutral)"
            echo ""
            echo "Replit prod publish is **manual by design** — this push is staged, not deployed."
            echo ""
            echo "- Detector: $DETECT_DETAIL"
            echo "- After clicking Publish, run: \`gh workflow run post-deploy-watchdog.yml -f assume_published=true\` for a full verification."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- Everything below runs ONLY when a publish pickup was ----------
      # ---------- detected — i.e. there is a live deploy to judge.      ----------

      - name: Watch /api/healthz for degradation
        id: monitor
        if: steps.detect.outputs.pickup != 'none'
        # Pure node, zero deps. Exit 0 = healthy, 1 = degraded/down (trigger
        # rollback), 2 = monitor crash (no rollback — fix the workflow).
        run: node scripts/deploy/rollback-monitor.mjs
        env:
          DEPLOY_URL: ${{ env.DEPLOY_URL }}
          LAST_BODY_PATH: ${{ runner.temp }}/watchdog-last-body.json
          # The detector already proved the live build is serving — no extra
          # settle wait needed before the stability polls.
          WATCHDOG_SETTLE_S: "0"
        continue-on-error: true

      - name: Verify critical-route content
        id: content
        # Wave 93 — defense in depth against the prerender silent-skip
        # regression. /api/healthz can be green while the prerendered
        # HTML files are empty SPA shells (which is exactly how
        # /sms-consent-disclosure shipped broken for weeks).
        #
        # Only runs when the healthz monitor passed — if the API itself
        # is degraded, content verification adds nothing actionable and
        # we want the healthz failure to drive the rollback flow.
        if: steps.detect.outputs.pickup != 'none' && steps.monitor.outputs.verdict == 'pass'
        run: node scripts/deploy/content-verification.mjs
        env:
          DEPLOY_URL: ${{ env.DEPLOY_URL }}
          LAST_REPORT_PATH: ${{ runner.temp }}/content-verification-report.json
        continue-on-error: true

      - name: Upload content-verification report
        if: always() && steps.monitor.outputs.verdict == 'pass'
        uses: actions/upload-artifact@v4
        with:
          name: content-verification-report
          path: ${{ runner.temp }}/content-verification-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Content warning only — build not attributable to this push
        # CI-QUIET: with a movement-only pickup we cannot prove WHICH commit
        # is live (version stamp not deployed yet). A content failure here is
        # a property of whatever build Replit is serving — flag it as a
        # warning + artifact, never as a failure email against this push.
        # Hard gate returns automatically once pickup=version (stamp live).
        if: >-
          steps.content.outputs.content_verdict == 'fail' &&
          steps.detect.outputs.pickup != 'version' &&
          env.ASSUME_PUBLISHED != 'true'
        env:
          CONTENT_REASON: ${{ steps.content.outputs.content_reason }}
          CONTENT_ROUTE: ${{ steps.content.outputs.content_failed_route }}
          PICKUP: ${{ steps.detect.outputs.pickup }}
        run: |
          echo "::warning::content verification failed against the LIVE build ($CONTENT_REASON) — build identity unproven (pickup=$PICKUP), not failing the run. First failed route: $CONTENT_ROUTE"

      - name: Open content-verification issue
        if: >-
          steps.content.outputs.content_verdict == 'fail' &&
          (steps.detect.outputs.pickup == 'version' || env.ASSUME_PUBLISHED == 'true')
        uses: actions/github-script@v7
        env:
          DEPLOYED_SHA: ${{ env.DEPLOYED_SHA }}
          CONTENT_REASON: ${{ steps.content.outputs.content_reason }}
          CONTENT_FAILED_ROUTE: ${{ steps.content.outputs.content_failed_route }}
          CONTENT_FAILED_ASSERTION: ${{ steps.content.outputs.content_failed_assertion }}
          TARGET_URL: ${{ env.DEPLOY_URL }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployed = process.env.DEPLOYED_SHA;
            const reason = process.env.CONTENT_REASON;
            const failedRoute = process.env.CONTENT_FAILED_ROUTE;
            const failedAssertion = process.env.CONTENT_FAILED_ASSERTION;
            const url = process.env.TARGET_URL;
            const run = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const title = `Post-deploy content verification FAILED — ${deployed.substring(0,7)} (${failedRoute || 'unknown route'})`;
            const issueBody = [
              `**Deployed commit:** \`${deployed.substring(0,7)}\` (\`${deployed}\`)`,
              `**Target URL:** ${url}`,
              `**Workflow run:** ${run}`,
              ``,
              `## Verdict`,
              `- **Reason:** ${reason}`,
              `- **First failed route:** \`${failedRoute || '(none)'}\``,
              `- **First failed assertion:** ${failedAssertion || '(none)'}`,
              ``,
              `## What this means`,
              `Prod \`/api/healthz\` is green — the server is up. But at least one critical`,
              `SEO / compliance route is serving an unhydrated SPA shell instead of real`,
              `prerendered content. External no-JS scrapers (TCR vetting bot, search`,
              `crawlers, link previews) will get garbage.`,
              ``,
              `## What to do`,
              `1. Download the \`content-verification-report\` artifact from the workflow run for the full per-route breakdown.`,
              `2. Check the \`Post-deploy Replit build\` logs for prerender warnings.`,
              `3. If prerender is the culprit, the fix is local (re-run \`npm run build\`, confirm \`dist/public/<route>/index.html\` has body content, push).`,
              `4. \`/api/healthz\` is still green so we are NOT auto-reverting \`main\`. If the regression is in code (not a prerender flake), open a manual revert PR.`,
              ``,
              `See [docs/operations/auto-rollback-playbook.md](../blob/main/docs/operations/auto-rollback-playbook.md).`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: issueBody,
              labels: ['post-deploy-watchdog-failed', 'content-verification', 'prerender'],
            });

      - name: Ping Sentry on content-verification fail (best-effort)
        if: >-
          steps.content.outputs.content_verdict == 'fail' &&
          (steps.detect.outputs.pickup == 'version' || env.ASSUME_PUBLISHED == 'true') &&
          env.SENTRY_DSN != ''
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FAILED_ROUTE: ${{ steps.content.outputs.content_failed_route }}
          FAILED_ASSERTION: ${{ steps.content.outputs.content_failed_assertion }}
        run: |
          curl -sS -X POST "https://sentry.io/api/0/projects/" \
            -H "Authorization: DSN ${SENTRY_DSN}" \
            -H "Content-Type: application/json" \
            -d '{
              "message": "Post-deploy content verification failed for '"${DEPLOYED_SHA:0:7}"' ('"${FAILED_ROUTE}"')",
              "level": "error",
              "tags": {
                "source": "post-deploy-watchdog",
                "category": "content-verification",
                "failed_route": "'"${FAILED_ROUTE}"'",
                "sha": "'"${DEPLOYED_SHA:0:7}"'"
              },
              "extra": {"assertion": "'"${FAILED_ASSERTION}"'"}
            }' || echo "Sentry ping failed (non-fatal)"

      - name: Read captured healthz body
        id: body
        if: always() && steps.detect.outputs.pickup != 'none'
        run: |
          BODY_PATH="${{ runner.temp }}/watchdog-last-body.json"
          if [ -f "$BODY_PATH" ]; then
            # Base64-encode the body to bypass GITHUB_OUTPUT's HEREDOC parser
            # entirely. The previous HEREDOC implementation broke when the
            # captured JSON had no trailing newline — the closing delimiter
            # ended up on the same line as the last byte, so GitHub never
            # saw a standalone "<DELIM>" line and rejected the buffer with
            # "Matching delimiter not found". Base64 collapses to a single
            # line with no whitespace, so the single-line key=value form is
            # always safe. Downstream steps decode via Buffer.from(b, 'base64').
            # See Wave 37 / run 26482831592 (HEALTHZ_EOF) and run 26483939264
            # (post-uuid retry) for the failure modes this guards against.
            BODY_B64=$(base64 -w 0 "$BODY_PATH")
            echo "body_b64=${BODY_B64}" >> "$GITHUB_OUTPUT"
            echo "body_missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "body_b64=" >> "$GITHUB_OUTPUT"
            echo "body_missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload captured healthz body
        if: always() && steps.detect.outputs.pickup != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-healthz-body
          path: ${{ runner.temp }}/watchdog-last-body.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Open rollback issue
        if: steps.monitor.outputs.verdict == 'fail'
        uses: actions/github-script@v7
        env:
          DEPLOYED_SHA: ${{ env.DEPLOYED_SHA }}
          PREVIOUS_SHA: ${{ steps.prev.outputs.previous_sha }}
          REASON: ${{ steps.monitor.outputs.reason }}
          FAILED_CHECK: ${{ steps.monitor.outputs.failed_check }}
          FAILED_STATUS: ${{ steps.monitor.outputs.failed_status }}
          PICKUP: ${{ steps.detect.outputs.pickup }}
          PICKUP_DETAIL: ${{ steps.detect.outputs.detail }}
          HEALTHZ_BODY_B64: ${{ steps.body.outputs.body_b64 }}
          HEALTHZ_BODY_MISSING: ${{ steps.body.outputs.body_missing }}
          TARGET_URL: ${{ env.DEPLOY_URL }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployed = process.env.DEPLOYED_SHA;
            const previous = process.env.PREVIOUS_SHA;
            const reason = process.env.REASON;
            const failedCheck = process.env.FAILED_CHECK;
            const failedStatus = process.env.FAILED_STATUS;
            const body = process.env.HEALTHZ_BODY_MISSING === 'true'
              ? '(no body captured — monitor never received a JSON response)'
              : Buffer.from(process.env.HEALTHZ_BODY_B64 || '', 'base64').toString('utf8');
            const url = process.env.TARGET_URL;
            const run = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const title = `Post-deploy watchdog FAILED — ${deployed.substring(0,7)} (${failedCheck || 'unknown'})`;
            const issueBody = [
              `**Pushed commit:** \`${deployed.substring(0,7)}\` (\`${deployed}\`)`,
              `**Previous good:** \`${previous.substring(0,7)}\` (\`${previous}\`)`,
              `**Target URL:** ${url}`,
              `**Workflow run:** ${run}`,
              `**Publish pickup:** \`${process.env.PICKUP}\` — ${process.env.PICKUP_DETAIL}`,
              ``,
              `## Verdict`,
              `- **Reason:** ${reason}`,
              `- **Failed check:** \`${failedCheck || '(none)'}\``,
              `- **Failed status:** \`${failedStatus || '(none)'}\``,
              ``,
              `## Last healthz body`,
              '```json',
              body,
              '```',
              ``,
              `## What happens next`,
              `An emergency rollback PR has been opened reverting \`main\` to \`${previous.substring(0,7)}\`.`,
              `Replit prod publish is MANUAL: merging the revert PR stages the older code — Alex must still click Publish.`,
              `See [docs/operations/auto-rollback-playbook.md](../blob/main/docs/operations/auto-rollback-playbook.md) for the response procedure.`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: issueBody,
              labels: ['post-deploy-watchdog-failed', 'rollback'],
            });

      - name: Ping Sentry (best-effort)
        if: steps.monitor.outputs.verdict == 'fail' && env.SENTRY_DSN != ''
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          # Sentry minidump endpoint accepts a JSON event with a Sentry auth header.
          # Best-effort only — failures here must not block the rollback PR step.
          curl -sS -X POST "https://sentry.io/api/0/projects/" \
            -H "Authorization: DSN ${SENTRY_DSN}" \
            -H "Content-Type: application/json" \
            -d '{
              "message": "Post-deploy watchdog failed for '"${DEPLOYED_SHA:0:7}"'",
              "level": "error",
              "tags": {"source": "post-deploy-watchdog", "sha": "'"${DEPLOYED_SHA:0:7}"'"}
            }' || echo "Sentry ping failed (non-fatal)"

      - name: Open emergency rollback PR
        if: steps.monitor.outputs.verdict == 'fail'
        uses: actions/github-script@v7
        env:
          DEPLOYED_SHA: ${{ env.DEPLOYED_SHA }}
          PREVIOUS_SHA: ${{ steps.prev.outputs.previous_sha }}
          REASON: ${{ steps.monitor.outputs.reason }}
          FAILED_CHECK: ${{ steps.monitor.outputs.failed_check }}
          HEALTHZ_BODY_B64: ${{ steps.body.outputs.body_b64 }}
          HEALTHZ_BODY_MISSING: ${{ steps.body.outputs.body_missing }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('node:child_process');
            const deployed = process.env.DEPLOYED_SHA;
            const previous = process.env.PREVIOUS_SHA;
            const failedCheck = process.env.FAILED_CHECK;
            const reason = process.env.REASON;
            const body = process.env.HEALTHZ_BODY_MISSING === 'true'
              ? '(no body captured — monitor never received a JSON response)'
              : Buffer.from(process.env.HEALTHZ_BODY_B64 || '', 'base64').toString('utf8');
            const run = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            // Create the revert branch by resetting it to the previous-good SHA.
            // This makes the diff "remove everything in `deployed` that isn't
            // in `previous`" — i.e. a literal revert of the bad commit.
            const branch = `auto-rollback/from-${deployed.substring(0,7)}-to-${previous.substring(0,7)}`;
            try {
              execSync(`git push --force origin ${previous}:refs/heads/${branch}`, { stdio: 'inherit' });
            } catch (err) {
              core.setFailed(`Failed to push revert branch: ${err.message}`);
              return;
            }

            const title = `REVERT: emergency auto-rollback after healthz failure`;
            const prBody = [
              `Automated rollback opened by [post-deploy-watchdog](${run}).`,
              ``,
              `Resets \`main\` to \`${previous.substring(0,7)}\` (the commit prior to \`${deployed.substring(0,7)}\`).`,
              ``,
              `## Why`,
              `A publish pickup was detected on prod and \`/api/healthz\` then failed the stability window:`,
              `- **Reason:** ${reason}`,
              `- **Failed check:** \`${failedCheck || '(none)'}\``,
              ``,
              `## Last healthz body`,
              '```json',
              body,
              '```',
              ``,
              `## Action required from a human`,
              `1. Review whether the failing check is a real regression in \`${deployed.substring(0,7)}\` or a transient vendor issue.`,
              `2. If real: **merge this PR**, then click Publish in Replit (prod deploys are manual) to ship the older code.`,
              `3. If transient: **close this PR**, mark the linked rollback issue resolved, and consider widening the watchdog thresholds.`,
              ``,
              `See [docs/operations/auto-rollback-playbook.md](../blob/main/docs/operations/auto-rollback-playbook.md).`,
              ``,
              `**Do not auto-merge. This PR is intentionally human-gated.**`,
            ].join('\n');

            let pr;
            try {
              const created = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                head: branch,
                base: 'main',
                body: prBody,
                draft: false,
              });
              pr = created.data;
            } catch (err) {
              core.setFailed(`Failed to open revert PR: ${err.message}`);
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['rollback', 'urgent', 'do-not-auto-merge'],
            });

            // Best-effort request review from the repo owner. If the username
            // isn't a collaborator (or doesn't exist), the API throws — we
            // swallow that so the PR still gets opened.
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                reviewers: [context.repo.owner],
              });
            } catch (err) {
              core.info(`Could not request review from ${context.repo.owner}: ${err.message}`);
            }

            core.notice(`Opened rollback PR #${pr.number}: ${pr.html_url}`);

      - name: Mark workflow as failed
        # CI-QUIET: the ONLY paths that produce a failed run (= an email):
        #   1. a publish pickup was detected AND healthz failed stability;
        #   2. a publish pickup attributable to this push (version stamp or
        #      operator-asserted) is serving broken content.
        # "Push not deployed yet" is NEUTRAL, never a failure.
        if: >-
          steps.monitor.outputs.verdict == 'fail' ||
          (steps.content.outputs.content_verdict == 'fail' &&
           (steps.detect.outputs.pickup == 'version' || env.ASSUME_PUBLISHED == 'true'))
        env:
          MONITOR_VERDICT: ${{ steps.monitor.outputs.verdict }}
          MONITOR_REASON: ${{ steps.monitor.outputs.reason }}
          CONTENT_VERDICT: ${{ steps.content.outputs.content_verdict }}
          CONTENT_REASON: ${{ steps.content.outputs.content_reason }}
          PICKUP: ${{ steps.detect.outputs.pickup }}
        run: |
          if [ "$MONITOR_VERDICT" = "fail" ]; then
            echo "::error::Post-deploy watchdog failed (healthz, pickup=$PICKUP): $MONITOR_REASON"
          fi
          if [ "$CONTENT_VERDICT" = "fail" ]; then
            echo "::error::Post-deploy watchdog failed (content verification): $CONTENT_REASON"
          fi
          exit 1
